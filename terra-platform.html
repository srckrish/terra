<script>
/* ============================================================
   Terra team (staff) views
   ============================================================ */
function distM(a, b, c, d) {
  const R = 6371000, t = x => x * Math.PI / 180;
  const dLat = t(c - a), dLng = t(d - b);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(t(a)) * Math.cos(t(c)) * Math.sin(dLng / 2) ** 2;
  return Math.round(2 * R * Math.asin(Math.sqrt(h)));
}
function autoChecks(p) {
  const e = p.ev, out = [];
  const d = distM(p.lat, p.lng, e.lat, e.lng);
  out.push({ok: d <= 400, label:'Photo location matches the listed site', detail: d + ' m away from the pinned location'});
  const t1 = new Date(e.stamps.before), t2 = new Date(e.stamps.after);
  out.push({ok: t2 > t1, label:'After photo was taken after the before photo', detail: ftime(e.stamps.before) + ' then ' + ftime(e.stamps.after)});
  out.push({ok: t1.toISOString().slice(0, 10) === p.date, label:'Work happened on the announced date', detail:'Announced ' + fdate(p.date)});
  const reg = volCount(p), chk = checkedCount(p);
  out.push({ok: e.participants <= Math.max(reg, chk) + 5, label:'Head count is consistent with sign ups', detail: e.participants + ' reported, ' + chk + ' checked in, ' + reg + ' signed up'});
  const ratio = e.achieved / Math.max(p.target, .001);
  out.push({ok: ratio <= 3, label:'Result is within a believable range of the target', detail: Math.round(ratio * 100) + '% of the target of ' + CATS[p.cat].phrase(p.target)});
  return out;
}
function staffHome() {
  const u = me();
  if (!u || !u.staff) return loginView();
  const tab = state.tab || 'overview';
  const pending = DB.projects.filter(p => p.status === 'pending');
  const review = DB.projects.filter(p => p.status === 'review');
  const rpending = DB.reports.filter(r => r.status === 'pending');
  const msgs = DB.messages.filter(m => m.status === 'new');
  const s = stats();

  const views = {
    overview: () => {
      const months = ['May','Jun','Jul','Aug','Sep'];
      const monthly = months.map((mo, i) => {
        const v = DB.projects.reduce((a, p) => a + (p.sponsors || []).filter(x => new Date(x.date).getMonth() === i + 4).reduce((b, x) => b + x.amount, 0), 0);
        return {k:mo, v, t:rsk(v)};
      });
      const byDistrict = Object.keys(DISTRICTS).map(d => ({k:d, v:s.live.filter(p => p.district === d).reduce((a, p) => a + raised(p), 0)})).map(d => Object.assign(d, {t:rsk(d.v)}));
      const byStatus = Object.keys(STATUS).map(k => ({k:STATUS[k][0], v:DB.projects.filter(p => p.status === k).length,
        c:k === 'verified' ? 'var(--moss)' : k === 'funding' ? 'var(--river)' : k === 'review' || k === 'pending' ? 'var(--gold)' : 'var(--ink3)'})).filter(d => d.v);
      return `<div class="grid4">
          ${tile(rsk(s.funds), 'Funds raised', 'var(--gold)')}
          ${tile(num(DB.projects.length), 'Projects')}
          ${tile(num(DB.users.length), 'Accounts')}
          ${tile(num(pending.length + review.length + rpending.length), 'Waiting on us', 'var(--flag)')}
        </div>
        ${(pending.length + review.length + rpending.length + msgs.length) ? `<div class="card mt stack-s"><h3>Queue</h3>
          <div class="row">
            <button class="btn sm" data-tab="approvals">${pending.length} project${pending.length === 1 ? '' : 's'} to approve</button>
            <button class="btn sm" data-tab="verification">${review.length} to verify</button>
            <button class="btn sm" data-tab="reports">${rpending.length} reported site${rpending.length === 1 ? '' : 's'}</button>
            <button class="btn sm" data-tab="messages">${msgs.length} message${msgs.length === 1 ? '' : 's'}</button>
          </div></div>` : '<div class="ok-note mt">Nothing in the queue. Everything is reviewed.</div>'}
        <div class="grid2 mt">
          <div class="card"><h3>Sponsorships each month</h3>${bars(monthly)}</div>
          <div class="card"><h3>Projects by stage</h3>${donut(byStatus.map(d => Object.assign(d, {t:d.v})), {label:'Projects', center:DB.projects.length})}</div>
        </div>
        <div class="grid2 mt">
          <div class="card"><h3>Funding by district</h3>${hbars(byDistrict)}</div>
          <div class="card"><h3>Verified results</h3>
            ${hbars([{k:'Waste removed', v:s.kg, t:num(s.kg) + ' kg', c:'var(--river)'},
                     {k:'Plastic recovered', v:s.verified.reduce((a, p) => a + ((p.ev && p.ev.plastic) || 0), 0), t:num(s.verified.reduce((a, p) => a + ((p.ev && p.ev.plastic) || 0), 0)) + ' kg', c:'var(--gold)'},
                     {k:'Area restored', v:s.ha * 1000, t:num(s.ha, 2) + ' ha', c:'var(--moss)'}])}</div>
        </div>
        <div class="card mt"><h3>All activity on the map</h3>
          ${mapHtml(projPoints(DB.projects.filter(p => p.status !== 'rejected')).concat(DB.reports.map(r => ({id:r.id, lat:r.lat, lng:r.lng, cat:r.cat, kind:'report', label:'Report: ' + r.title}))))}</div>`;
    },
    approvals: () => pending.length ? `<div class="stack">${pending.map(p => {
        const o = userById(p.ownerId);
        return `<div class="card stack">
          <div class="row between"><div><h3>${esc(p.title)}</h3>
            <div class="small muted">${esc(p.org)} · ${esc(p.place)}, ${esc(p.district)} · submitted ${fdate(p.created)}</div></div>${statusPill(p.status)}</div>
          <p class="muted small">${esc(p.desc)}</p>
          <dl class="kv"><dt>Budget asked</dt><dd>${rs(p.goal)}</dd>
            <dt>Spending plan</dt><dd style="text-align:left;font-weight:400">${esc(p.budget || '—')}</dd>
            <dt>Target</dt><dd>${esc(CATS[p.cat].phrase(p.target))}</dd>
            <dt>Organizer</dt><dd>${o ? esc(o.name) : '—'}${o && o.orgProfile && o.orgProfile.verified ? ' · verified' : ' · not verified'}</dd>
            <dt>Their track record</dt><dd>${DB.projects.filter(x => x.ownerId === p.ownerId && x.status === 'verified').length} verified</dd></dl>
          <form data-form="approve" data-id="${p.id}">
            <div class="field"><label for="an${p.id}">Note to the organizer</label><input id="an${p.id}" name="note" placeholder="Optional"></div>
            <div class="row mt"><button class="btn pri" name="decision" value="approve" type="submit">Approve and list it</button>
              <button class="btn danger" name="decision" value="reject" type="submit">Turn down</button>
              <button class="btn" type="button" data-go="project" data-id="${p.id}">Preview page</button></div>
          </form></div>`;
      }).join('')}</div>` : empty('No projects waiting', 'Every submitted project has been reviewed.'),
    verification: () => review.length ? `<div class="stack">${review.map(p => {
        const ch = autoChecks(p), bad = ch.filter(c => !c.ok).length;
        return `<div class="card stack">
          <div class="row between"><div><h3>${esc(p.title)}</h3>
            <div class="small muted">${esc(p.org)} · evidence sent ${ftime(p.ev.submittedAt)}</div></div>
            <span class="status ${bad ? 's-rejected' : 's-verified'}">${bad ? bad + ' check' + (bad > 1 ? 's' : '') + ' failed' : 'All checks passed'}</span></div>
          <div class="photogrid">
            <figure><img src="${p.ev.before}" alt="Before"><figcaption>Before · ${ftime(p.ev.stamps.before)}</figcaption></figure>
            <figure><img src="${p.ev.after}" alt="After"><figcaption>After · ${ftime(p.ev.stamps.after)}</figcaption></figure>
          </div>
          <ul class="ul">${ch.map(c => `<li><span style="color:${c.ok ? 'var(--moss)' : 'var(--flag)'}">${c.ok ? CHECK : '✕'}</span>
            <span><b style="color:var(--ink)">${esc(c.label)}</b><br><span class="small">${esc(c.detail)}</span></span></li>`).join('')}</ul>
          <p class="small muted">Organizer note: ${esc(p.ev.note)}</p>
          <form data-form="verify" data-id="${p.id}">
            <div class="field"><label for="vn${p.id}">Reviewer note</label><input id="vn${p.id}" name="note" placeholder="What you checked"></div>
            <div class="row mt"><button class="btn pri" name="decision" value="verify" type="submit">Verify and release the rest</button>
              <button class="btn danger" name="decision" value="flag" type="submit">Send back for more evidence</button></div>
          </form></div>`;
      }).join('')}</div>` : empty('Nothing to verify', 'No evidence is waiting for review.'),
    reports: () => DB.reports.length ? `<div class="stack">${DB.reports.map(r => `<div class="card stack">
        <div class="row between"><div><h3>${esc(r.title)}</h3>
          <div class="small muted">${esc(r.place)}, ${esc(r.district)} · ${esc(CATS[r.cat].label)} · ${fdate(r.created)}</div></div>${statusPill(r.status, RSTATUS)}</div>
        <div class="split" style="gap:16px">
          <div class="thumb"><img src="${r.photo}" alt=""></div>
          <div class="stack-s"><p class="small muted">${esc(r.desc)}</p>
            <div class="small">From ${esc(r.by.name)} · ${esc(r.by.phone || r.by.email || 'no contact')}</div>
            ${r.status === 'pending' ? `<form data-form="report-review" data-id="${r.id}">
              <div class="field"><label for="rr${r.id}">Note for organizers</label><input id="rr${r.id}" name="note" placeholder="Optional"></div>
              <div class="row mt"><button class="btn pri sm" name="decision" value="approved" type="submit">Approve</button>
                <button class="btn danger sm" name="decision" value="rejected" type="submit">Turn down</button></div></form>`
            : `<div><button class="btn sm" data-go="report" data-id="${r.id}">Open</button></div>`}</div>
        </div></div>`).join('')}</div>` : empty('No reports yet', 'Nothing has been sent in.'),
    messages: () => DB.messages.length ? `<div class="card pad0"><div class="scroll-x"><table class="tbl">
        <thead><tr><th>From</th><th>Subject</th><th>Message</th><th>Date</th><th></th></tr></thead>
        <tbody>${DB.messages.map(m => `<tr>
          <td><div class="b">${esc(m.name)}</div><div class="small muted">${esc(m.email)}</div></td>
          <td>${esc(m.subject)}</td><td class="muted">${esc(m.body)}</td><td class="muted">${fdate(m.created)}</td>
          <td class="r">${m.status === 'new' ? `<button class="btn sm" data-act="msg-done" data-id="${m.id}">Mark handled</button>` : `<span class="status s-verified">${CHECK} Handled</span>`}</td>
        </tr>`).join('')}</tbody></table></div></div>` : empty('No messages', 'The contact form is empty.'),
    people: () => `<div class="card pad0"><div class="scroll-x"><table class="tbl">
        <thead><tr><th>Name</th><th>Contact</th><th>Roles</th><th>Joined</th><th class="r">Sponsored</th><th class="r">Projects run</th></tr></thead>
        <tbody>${DB.users.map(x => {
          const sp = DB.projects.reduce((a, p) => a + (p.sponsors || []).filter(s => s.userId === x.id).reduce((b, s) => b + s.amount, 0), 0);
          return `<tr><td><div class="b">${esc(x.name)}</div>${x.orgProfile ? `<div class="small muted">${esc(x.orgProfile.name)}</div>` : ''}</td>
            <td class="muted">${esc(x.email)}<br>${esc(x.phone)}</td>
            <td><div class="pill-row"><span class="tag">Supporter</span>${x.organizer ? '<span class="tag">Organizer</span>' : ''}${x.staff ? '<span class="tag">Terra team</span>' : ''}</div></td>
            <td class="muted">${fdate(x.joined)}</td><td class="r b">${sp ? rs(sp) : '—'}</td>
            <td class="r">${DB.projects.filter(p => p.ownerId === x.id).length}</td></tr>`;
        }).join('')}</tbody></table></div></div>`
  };
  const body = views[tab] || views.overview;

  return `${header()}<main><div class="wrap pagehead">
    <div class="row between"><div><h1>Terra team</h1>
      <p class="lead">Approvals, verification and everything happening on the platform.</p></div>
      <span class="demo-chip">${ICONS.shield.replace('width="20" height="20"','width="13" height="13"')} Staff view</span></div>
    ${subtabs([['overview','Overview'], ['approvals','Approvals (' + pending.length + ')'], ['verification','Verification (' + review.length + ')'],
      ['reports','Reported sites (' + rpending.length + ')'], ['messages','Messages (' + msgs.length + ')'], ['people','People']], tab)}
  </div>
  <div class="wrap mt">${body()}</div></main>${footer()}`;
}
</script>
<script>
/* ============================================================
   Modals
   ============================================================ */
const TODAY = '2026-09-19';
function receiptModal(p, s) {
  const ms = {fee:s.amount * FEE, up:s.amount * (1 - FEE) * UPFRONT, rest:s.amount * (1 - FEE) * (1 - UPFRONT)};
  return `<div class="modal stack">
    <button class="x" data-act="close" aria-label="Close">×</button>
    <h2>Sponsorship receipt</h2>
    <dl class="kv">
      <dt>Reference</dt><dd>TR-${esc(p.id.toUpperCase())}-${esc(String(s.id).slice(-4).toUpperCase())}</dd>
      <dt>Sponsor</dt><dd>${esc(s.name)}${s.anon ? ' (shown as anonymous)' : ''}</dd>
      <dt>Project</dt><dd>${esc(p.title)}</dd>
      <dt>Date</dt><dd>${fdate(s.date)}</dd>
      <dt>Amount</dt><dd>${rs(s.amount)}</dd>
      <dt>Terra fee</dt><dd>${rs(ms.fee)}</dd>
      <dt>To the organizer upfront</dt><dd>${rs(ms.up)}</dd>
      <dt>After verification</dt><dd>${rs(ms.rest)}</dd>
      <dt>Status</dt><dd>${esc(STATUS[p.status][0])}</dd>
    </dl>
    <p class="tiny muted">Prototype receipt. No payment was processed.</p>
    <div class="row"><button class="btn" data-act="print">Print</button><button class="btn pri" data-act="close">Done</button></div>
  </div>`;
}
function modalHtml() {
  const m = state.modal; if (!m) return '';
  let inner = '';
  if (m.type === 'sponsor') inner = sponsorModal(byId(m.id));
  else if (m.type === 'volunteer') inner = volunteerModal(byId(m.id));
  else if (m.type === 'thanks') inner = thanksModal(m);
  else if (m.type === 'cert') { const p = byId(m.id); const e = m.kind === 'sponsor' ? p.sponsors.find(x => x.id === m.sid) : p.vols.find(x => x.id === m.sid); inner = e ? certModal(m.kind, p, e) : ''; }
  else if (m.type === 'receipt') { const p = byId(m.id); const s = p.sponsors.find(x => x.id === m.sid); inner = s ? receiptModal(p, s) : ''; }
  return `<div class="mask" data-mask="1">${inner}</div>`;
}

/* ============================================================
   Form helpers
   ============================================================ */
function captureForm(form) {
  if (!form) return state.form;
  Array.from(form.elements).forEach(el => {
    if (!el.name) return;
    if (el.type === 'checkbox') state.form[el.name] = el.checked;
    else if (el.type === 'radio') { if (el.checked) state.form[el.name] = el.value; }
    else state.form[el.name] = el.value;
  });
  return state.form;
}
function need(f, keys) { return keys.filter(k => !String(f[k] || '').trim()).length === 0; }
function readPhoto(file, cb) {
  if (!file) return;
  if (file.size > 4.5 * 1024 * 1024) { toast('That image is larger than 4.5 MB. Pick a smaller one.'); return; }
  const r = new FileReader();
  r.onload = () => cb(r.result);
  r.onerror = () => toast('That file could not be read.');
  r.readAsDataURL(file);
}

/* ============================================================
   Actions
   ============================================================ */
const ACT = {
  nav() { state.navOpen = !state.navOpen; render(); },
  menu() { state.menu = !state.menu; render(); },
  close() { state.modal = null; state.err = ''; render(); },
  logout() { logout(); },
  reset() { if (confirm('Reset all demo data? Accounts and projects you added here will be removed.')) resetAll(); },
  print() { window.print(); },
  sponsor(el) { state.form = {}; openModal({type:'sponsor', id:el.dataset.id}); },
  volunteer(el) { state.form = {}; openModal({type:'volunteer', id:el.dataset.id}); },
  cert(el) { openModal({type:'cert', id:el.dataset.id, kind:el.dataset.kind, sid:el.dataset.sid}); },
  receipt(el) { openModal({type:'receipt', id:el.dataset.id, sid:el.dataset.sid}); },
  'cert-dl'(el) {
    const p = byId(el.dataset.id);
    const e = el.dataset.kind === 'sponsor' ? p.sponsors.find(x => x.id === el.dataset.sid) : p.vols.find(x => x.id === el.dataset.sid);
    svgToPng(certSvg(el.dataset.kind, certData(el.dataset.kind, p, e)), 1800, 1240, 'terra-certificate-' + p.id + '.png');
  },
  'poster-dl'(el) { const p = byId(el.dataset.id); svgToPng(posterSvg(p), 1200, 1600, 'terra-poster-' + p.id + '.png'); },
  share(el) { copyText(location.href.split('#')[0] + '#project-' + el.dataset.id, 'Project link copied'); },
  'copy-share'(el) { copyText(shareText(byId(el.dataset.id)), 'Message copied'); },
  'checkin-row'(el) {
    const p = byId(el.dataset.id), v = p.vols.find(x => x.id === el.dataset.vid);
    v.checkedIn = v.people; save(); render(); toast(v.name + ' checked in (' + v.people + ')');
  },
  'msg-done'(el) { const m = DB.messages.find(x => x.id === el.dataset.id); m.status = 'done'; save(); render(); toast('Marked as handled'); },
  claim(el) {
    const r = DB.reports.find(x => x.id === el.dataset.id), u = me();
    if (!u || !u.organizer) { go('org-start'); return; }
    state.form = {fromReport:r.id, title:r.title, cat:r.cat, district:r.district, place:r.place, desc:r.desc + '\n\nReported by ' + r.by.name + '.',
      lat:r.lat, lng:r.lng, goal:30000, needed:30, target:500, date:'2026-12-06', scope:''};
    state.pick = {lat:r.lat, lng:r.lng};
    state.view = {name:'org-home'}; state.tab = 'new'; render(); window.scrollTo({top:0});
    toast('Details copied into a new project');
  }
};

/* ============================================================
   Form submissions
   ============================================================ */
const FORMS = {
  contact(f) {
    if (!need(f, ['name','email','body'])) { state.err = 'Fill in your name, email and message.'; return render(); }
    DB.messages.unshift({id:uid('m_'), name:f.name, email:f.email, subject:f.subject || 'Something else', body:f.body, created:TODAY, status:'new'});
    save(); state.form = {}; go('home');
    openModal({type:'thanks', headline:'Message sent to the Terra team', body:'We reply within two working days on ' + esc(ORGINFO.email) + '.'});
  },
  login(f) {
    const err = login(f.email, f.pass || 'demo1234');
    if (err) { state.err = err; return render(); }
    const u = me();
    go(u.staff ? 'staff-home' : 'sup-home'); toast('Signed in as ' + u.name);
  },
  signup(f) {
    if (!need(f, ['name','email','phone','pass'])) { state.err = 'Fill in every field so we can reach you.'; return render(); }
    if (DB.users.some(u => u.email.toLowerCase() === f.email.trim().toLowerCase())) { state.err = 'An account already uses that email. Sign in instead.'; return render(); }
    const u = mkUser({name:f.name.trim(), email:f.email.trim(), phone:f.phone.trim(), pass:f.pass, kind:f.kind || 'individual',
      orgName:f.kind === 'organization' ? f.name.trim() : '', joined:TODAY, organizer:!!f.organizer});
    DB.users.push(u); DB.session = {userId:u.id, mode:'supporter'};
    attachGuestActivity(u); save(); state.form = {};
    go(f.organizer ? 'org-start' : 'sup-home'); toast('Account created');
  },
  settings(f) {
    const u = me();
    u.name = f.name || u.name; u.email = f.email || u.email; u.phone = f.phone || u.phone; u.organizer = !!f.organizer;
    save(); render(); toast('Changes saved');
  },
  sponsor(f, id) {
    const p = byId(id), amt = Math.round(Number(f.amount));
    if (!(amt >= 100)) { state.err = 'The smallest sponsorship is Rs. 100.'; return render(); }
    if (!String(f.name || '').trim()) { state.err = 'Add the name the certificate should carry.'; return render(); }
    const u = me();
    if (!u && !String(f.email || '').trim()) { state.err = 'Add an email so we can send your receipt.'; return render(); }
    const s = {id:uid('s_'), userId:u ? u.id : null, name:f.name.trim(), kind:f.kind || 'individual', amount:amt, date:TODAY,
      anon:!!f.anon, email:f.email || (u ? u.email : ''), phone:f.phone || (u ? u.phone : '')};
    p.sponsors.push(s);
    if (raised(p) >= p.goal && p.status === 'funding') p.status = 'ready';
    save(); state.form = {};
    openModal({type:'thanks', headline:'Thank you. ' + rs(amt) + ' is now behind this project.',
      body: `${esc(p.title)} is at ${pct(raised(p), p.goal)}% of its budget. ${p.status === 'ready' ? 'It is fully funded, so the organizer can start buying what they need.' : ''} Your certificate is issued once the Terra team verifies the result.`,
      goName:'sup-home', goLabel:'See my sponsorships'});
  },
  volunteer(f, id) {
    const p = byId(id), u = me();
    const kind = f.kind || 'individual';
    const people = kind === 'organization' ? Math.max(2, Math.round(Number(f.people) || 2)) : 1;
    if (!String(f.name || '').trim() || !String(f.phone || '').trim()) { state.err = 'We need a name and a phone number for the day.'; return render(); }
    if (kind === 'organization' && !String(f.contact || '').trim()) { state.err = 'Add the name of the person leading the group.'; return render(); }
    const v = {id:uid('v_'), userId:u ? u.id : null, name:f.name.trim(), kind, people, phone:f.phone.trim(),
      contact:f.contact || '', email:f.email || (u ? u.email : ''), code:'TV-' + uid().toUpperCase(), checkedIn:0, at:TODAY};
    p.vols.push(v); save(); state.form = {};
    openModal({type:'thanks', headline: kind === 'organization' ? people + ' places held for ' + v.name : 'You are signed up',
      body:'Show this ticket to the organizer on ' + fdate(p.date) + '. One ticket covers the whole sign up.',
      ticket:'<div class="mt">' + ticketHtml(p, v) + '</div>', goName:'sup-home', goLabel:'See my tickets'});
  },
  'report-new'(f) {
    if (!need(f, ['title','place','desc'])) { state.err = 'Add a title, a landmark and a short description.'; return render(); }
    const u = me();
    if (!u && !need(f, ['by','phone'])) { state.err = 'Add your name and phone number so we can follow up.'; return render(); }
    const loc = state.pick || {lat:DISTRICTS[f.district || 'Kathmandu'][0], lng:DISTRICTS[f.district || 'Kathmandu'][1]};
    const r = {id:uid('r_'), title:f.title.trim(), cat:f.cat || 'waste', district:f.district || 'Kathmandu', place:f.place.trim(),
      lat:loc.lat, lng:loc.lng, desc:f.desc.trim(), photo:f.photo || samplePhoto('before', Math.floor(Math.random() * 9) + 1, f.cat || 'waste'),
      by:{name:u ? u.name : f.by.trim(), phone:u ? u.phone : f.phone.trim(), email:u ? u.email : (f.email || ''), userId:u ? u.id : null},
      created:TODAY, status:'pending'};
    DB.reports.unshift(r); save(); state.form = {}; state.pick = null;
    go('reports');
    openModal({type:'thanks', headline:'Thank you, your report is with the Terra team',
      body:'We check every site, usually within two working days. Once it is approved, organizers can pick it up and raise the money to fix it.',
      goName:'sup-home', goLabel:'See my reports'});
  },
  'report-review'(f, id, decision) {
    const r = DB.reports.find(x => x.id === id), u = me();
    r.status = decision; r.note = f.note || ''; r.reviewedBy = u ? u.name : 'Terra team';
    save(); render(); toast(decision === 'approved' ? 'Approved and visible to organizers' : 'Report turned down');
  },
  'org-profile'(f) {
    const u = me();
    if (!need(f, ['name','ward','contact','about'])) { state.err = 'Fill in every field so Terra can review you.'; return render(); }
    u.organizer = true;
    u.orgProfile = {name:f.name.trim(), type:f.type || 'organization', ward:f.ward.trim(), contact:f.contact.trim(), about:f.about.trim(), verified:true};
    DB.session.mode = 'organizer'; save(); state.form = {}; state.tab = 'overview';
    go('org-home'); toast('Organizer profile approved for the demo');
  },
  'org-new'(f) {
    const u = me();
    if (!need(f, ['title','place','desc','scope','budget'])) { state.err = 'Fill in the title, place, description, scope and budget.'; return render(); }
    const loc = state.pick || {lat:DISTRICTS[f.district || 'Kathmandu'][0], lng:DISTRICTS[f.district || 'Kathmandu'][1]};
    const p = {id:uid('p_'), title:f.title.trim(), ownerId:u.id, org:u.orgProfile.name, cat:f.cat || 'waste', district:f.district || 'Kathmandu',
      place:f.place.trim(), scope:f.scope.trim(), lat:loc.lat, lng:loc.lng, date:f.date, target:Number(f.target) || 0,
      needed:Number(f.needed) || 10, goal:Number(f.goal) || 10000, status:'pending', desc:f.desc.trim(), budget:f.budget.trim(),
      created:TODAY, sponsors:[], vols:[], fromReport:f.fromReport || null};
    DB.projects.unshift(p);
    if (f.fromReport) { const r = DB.reports.find(x => x.id === f.fromReport); if (r) { r.status = 'claimed'; r.claimedBy = u.orgProfile.name; } }
    save(); state.form = {}; state.pick = null; state.tab = 'projects';
    go('org-home');
    openModal({type:'thanks', headline:'Sent to Terra for approval',
      body:'We check the organizer, the site and the budget before listing a project. You will hear back within two working days.'});
  },
  evidence(f, id) {
    const p = byId(id);
    if (!String(f.note || '').trim()) { state.err = 'Add a note for the reviewer so they know what to check.'; return render(); }
    p.ev = {
      before: f.before || samplePhoto('before', 4, p.cat), after: f.after || samplePhoto('after', 4, p.cat),
      lat: Number(f.lat) || p.lat, lng: Number(f.lng) || p.lng, locSrc:'Device GPS',
      stamps:{before: p.date + 'T08:10:00', after: p.date + 'T15:20:00'},
      participants: Number(f.participants) || 0, achieved: Number(f.achieved) || 0, plastic: Number(f.plastic) || 0,
      note: f.note.trim(), submittedAt: TODAY + 'T10:00:00'
    };
    p.status = 'review'; save(); state.form = {}; state.subtab = 'evidence'; render();
    toast('Evidence sent to the Terra team');
  },
  checkin(f, id) {
    const p = byId(id), code = String(f.code || '').trim().toUpperCase();
    const v = (p.vols || []).find(x => x.code.toUpperCase() === code);
    if (!v) { state.err = 'No ticket with that code on this project. Check the letters and try again.'; return render(); }
    v.checkedIn = v.people; save(); state.err = ''; state.form = {}; render();
    toast(v.name + ' checked in (' + v.people + ' ' + (v.people > 1 ? 'people' : 'person') + ')');
  },
  approve(f, id, decision) {
    const p = byId(id), u = me();
    if (decision === 'approve') { p.status = 'funding'; p.reviewNote = f.note || ''; toast('Project approved and listed'); }
    else { p.status = 'rejected'; p.reviewNote = f.note || 'Not approved.'; toast('Project turned down'); }
    p.reviewedBy = u.name; save(); render();
  },
  verify(f, id, decision) {
    const p = byId(id), u = me();
    if (decision === 'verify') {
      p.status = 'verified';
      p.verified = {at:TODAY, by:u.name + ', Terra review team', note:f.note || 'Evidence checked against the location and the head count.'};
      toast('Verified. The remaining funds are released.');
    } else { p.status = 'evidence'; p.ev.flagged = f.note || 'More evidence needed.'; toast('Sent back to the organizer'); }
    save(); render();
  }
};

/* ============================================================
   Event wiring
   ============================================================ */
document.addEventListener('click', e => {
  const t = e.target;
  const mask = t.closest && t.closest('[data-mask]');
  if (mask && t === mask) { ACT.close(); return; }

  const act = t.closest && t.closest('[data-act]');
  if (act) { const fn = ACT[act.dataset.act]; if (fn) { e.preventDefault(); fn(act); return; } }

  const mk = t.closest && t.closest('[data-mk]');
  if (mk) { e.preventDefault(); const kind = mk.dataset.kind; go(kind === 'report' ? 'report' : 'project', mk.dataset.mk); return; }

  const pickbox = t.closest && t.closest('[data-pickmap]');
  if (pickbox) {
    const svg = pickbox.querySelector('svg'), r = svg.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width * MAPB.W, y = (e.clientY - r.top) / r.height * MAPB.H;
    captureForm(pickbox.closest('form'));
    state.pick = {lat:Number(uny(y).toFixed(4)), lng:Number(unx(x).toFixed(4))};
    render(); return;
  }

  const gob = t.closest && t.closest('[data-go]');
  if (gob) {
    e.preventDefault();
    if (gob.dataset.subtab) state.subtab = gob.dataset.subtab;
    if (gob.dataset.go === 'org-home' || gob.dataset.go === 'sup-home' || gob.dataset.go === 'staff-home') state.tab = 'overview';
    if (['org-home','org-project','org-start'].includes(gob.dataset.go) && DB.session) DB.session.mode = 'organizer';
    if (['sup-home'].includes(gob.dataset.go) && DB.session) DB.session.mode = 'supporter';
    if (['staff-home'].includes(gob.dataset.go) && DB.session) DB.session.mode = 'staff';
    go(gob.dataset.go, gob.dataset.id);
    return;
  }

  const md = t.closest && t.closest('[data-mode]');
  if (md) { setMode(md.dataset.mode); return; }

  const dm = t.closest && t.closest('[data-demo]');
  if (dm) { const err = login(dm.dataset.demo, 'demo1234'); if (!err) { const u = me(); go(u.staff ? 'staff-home' : 'sup-home'); toast('Signed in as ' + u.name); } return; }

  const fl = t.closest && t.closest('[data-filter]');
  if (fl) {
    const k = fl.dataset.filter;
    state.filter[k] = k === 'open' ? !state.filter.open : fl.dataset.val;
    render(); return;
  }
  const vw = t.closest && t.closest('[data-vw]');
  if (vw) { state.filter.view = vw.dataset.vw; render(); return; }

  const tb = t.closest && t.closest('[data-tab]');
  if (tb) { state.tab = tb.dataset.tab; state.form = {}; state.err = ''; render(); window.scrollTo({top:0}); return; }

  const stb = t.closest && t.closest('[data-subtab]');
  if (stb) { state.subtab = stb.dataset.subtab; state.err = ''; if (stb.dataset.id) { state.view = {name:'org-project', id:stb.dataset.id}; } render(); return; }

  const amt = t.closest && t.closest('[data-amt]');
  if (amt) { captureForm(amt.closest('form')); state.form.amount = amt.dataset.amt; render(); return; }

  if (state.menu && !(t.closest && t.closest('.menu'))) { state.menu = false; render(); }
});

document.addEventListener('submit', e => {
  const form = e.target.closest('[data-form]');
  if (!form) return;
  e.preventDefault();
  const f = captureForm(form);
  const fn = FORMS[form.dataset.form];
  const decision = e.submitter ? e.submitter.value : null;
  state.err = '';
  if (fn) fn(f, form.dataset.id, decision);
});

document.addEventListener('change', e => {
  const ph = e.target.closest && e.target.closest('[data-photo]');
  if (ph) {
    const slot = ph.dataset.photo === '1' ? 'photo' : ph.dataset.photo;
    captureForm(ph.closest('form'));
    readPhoto(ph.files[0], data => { state.form[slot] = data; render(); toast('Photo added'); });
    return;
  }
  const live = e.target.closest && e.target.closest('[data-live]');
  if (live) { captureForm(live.closest('form')); render(); }
});

document.addEventListener('input', e => {
  const s = e.target.closest && e.target.closest('[data-search]');
  if (s) { state.filter.q = s.value; state.refocus = true; render(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && state.modal) ACT.close();
});

/* ============================================================
   Render
   ============================================================ */
function view() {
  const v = state.view;
  switch (v.name) {
    case 'home': return home();
    case 'projects': return projects();
    case 'project': return projectView(byId(v.id));
    case 'reports': return reports();
    case 'report': return reportView(DB.reports.find(r => r.id === v.id));
    case 'report-new': return reportNew();
    case 'about': return about();
    case 'contact': return contact();
    case 'login': return loginView();
    case 'signup': return signupView();
    case 'settings': return settings();
    case 'sup-home': return supHome();
    case 'org-start': return orgStart();
    case 'org-home': return orgHome();
    case 'org-project': return orgProject(byId(v.id));
    case 'staff-home': return staffHome();
    default: return home();
  }
}
function render() {
  const app = document.getElementById('app');
  app.innerHTML = view() + modalHtml();
  if (state.refocus) {
    const s = app.querySelector('[data-search]');
    if (s) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
    state.refocus = false;
  }
  bindMapTips();
}
function bindMapTips() {
  document.querySelectorAll('.mapbox').forEach(box => {
    const tip = box.querySelector('.maptip');
    if (!tip) return;
    box.querySelectorAll('[data-mk]').forEach(g => {
      const show = ev => {
        const r = box.getBoundingClientRect();
        const c = (ev.touches ? ev.touches[0] : ev);
        tip.textContent = g.getAttribute('aria-label');
        tip.style.left = (c.clientX - r.left) + 'px';
        tip.style.top = (c.clientY - r.top) + 'px';
        tip.dataset.on = '1';
      };
      g.addEventListener('mouseenter', show);
      g.addEventListener('mousemove', show);
      g.addEventListener('mouseleave', () => tip.dataset.on = '0');
      g.addEventListener('focus', () => { tip.textContent = g.getAttribute('aria-label'); tip.dataset.on = '1'; tip.style.left = '50%'; tip.style.top = '20px'; });
      g.addEventListener('blur', () => tip.dataset.on = '0');
      g.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); g.click(); } });
    });
  });
}

/* ============================================================
   Start
   ============================================================ */
DB = load() || seedDB();
if (!DB.log) DB.log = [];
(function start() {
  const h = location.hash || '';
  if (h.startsWith('#project-') && DB.projects.some(p => p.id === h.slice(9))) state.view = {name:'project', id:h.slice(9)};
  else if (h.startsWith('#report-')) state.view = {name:'report', id:h.slice(8)};
  render();
})();
</script>
