<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Terra | Fund and verify community environmental work</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --raise:#FAFCFB; --ink:#10242A; --ink2:#4B6166; --ink3:#748A8E; --line:#DBE4E2;
  --river:#166F7C; --river-soft:#E0F0F1; --on-river:#FFFFFF;
  --gold:#B57B08; --gold-soft:#FAF0D8; --moss:#33754A; --moss-soft:#E1F0E5;
  --flag:#AC4320; --flag-soft:#F9E7E0; --overlay:rgba(16,36,42,.5);
  --shadow:0 1px 2px rgba(16,36,42,.06),0 8px 24px -16px rgba(16,36,42,.3);
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D191C; --surface:#132428; --raise:#182D31; --ink:#E7F0EF; --ink2:#9FB4B5; --ink3:#7A9092; --line:#27393D;
    --river:#5EB8C2; --river-soft:#163239; --on-river:#08181B;
    --gold:#EFBA43; --gold-soft:#372C13; --moss:#7CC28C; --moss-soft:#183021;
    --flag:#E9906B; --flag-soft:#38200F; --overlay:rgba(0,0,0,.66);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -18px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --bg:#0D191C; --surface:#132428; --raise:#182D31; --ink:#E7F0EF; --ink2:#9FB4B5; --ink3:#7A9092; --line:#27393D;
  --river:#5EB8C2; --river-soft:#163239; --on-river:#08181B;
  --gold:#EFBA43; --gold-soft:#372C13; --moss:#7CC28C; --moss-soft:#183021;
  --flag:#E9906B; --flag-soft:#38200F; --overlay:rgba(0,0,0,.66);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -18px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 "Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom,0px);overflow-x:hidden}
h1,h2,h3,h4,.disp{font-family:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;letter-spacing:-.018em;line-height:1.1;margin:0}
h1{font-size:clamp(30px,5vw,50px);font-weight:800}
h2{font-size:clamp(22px,3vw,30px);font-weight:700}
h3{font-size:19px;font-weight:700}
h4{font-size:15px;font-weight:700}
p{margin:0}
img{max-width:100%}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--river);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--river);outline-offset:2px;border-radius:4px}
.wrap{max-width:1140px;margin:0 auto;padding:0 20px;width:100%}
.narrow{max-width:760px}
.muted{color:var(--ink2)}
.small{font-size:13.5px}
.tiny{font-size:12.5px}
.b{font-weight:600}
.stack>*+*{margin-top:14px}
.stack-s>*+*{margin-top:8px}
.sr{position:absolute;left:-9999px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.spacer{flex:1}
.mt{margin-top:18px}.mt2{margin-top:30px}.mb{margin-bottom:14px}
hr{border:0;border-top:1px solid var(--line);margin:22px 0}

/* ---------- header ---------- */
.top{background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40;padding-top:env(safe-area-inset-top,0px)}
.top-in{display:flex;align-items:center;gap:14px;padding:11px 0}
.brand{display:flex;align-items:center;gap:9px;border:0;background:none;padding:0;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:23px;letter-spacing:-.03em;color:var(--ink)}
.brand .mk{width:30px;height:30px;border-radius:9px;background:var(--river);color:var(--on-river);display:grid;place-items:center;flex:none}
.nav{display:flex;gap:2px;margin-left:10px;flex-wrap:wrap}
.nav button{border:0;background:none;padding:8px 12px;border-radius:9px;font-weight:500;font-size:14.5px;color:var(--ink2)}
.nav button:hover{background:var(--bg);color:var(--ink)}
.nav button[aria-current="page"]{color:var(--ink);background:var(--river-soft);font-weight:600}
.navtoggle{display:none}
.auth-btn{white-space:nowrap}
.only-sm{display:none}
.modes{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--bg);gap:2px}
.modes button{border:0;background:none;padding:6px 13px;border-radius:999px;font-weight:600;font-size:13.5px;color:var(--ink2);white-space:nowrap}
.modes button[aria-pressed="true"]{background:var(--river);color:var(--on-river)}
.avatar{width:34px;height:34px;border-radius:999px;background:var(--gold-soft);color:var(--gold);display:grid;place-items:center;font-weight:700;font-size:14px;border:1px solid var(--line);flex:none}
.menu{position:relative}
.menu-pop{position:absolute;right:0;top:44px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:230px;padding:8px;z-index:50}
.menu-pop button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px;font-size:14.5px;font-weight:500}
.menu-pop button:hover{background:var(--bg)}
.menu-pop .hd{padding:8px 10px;font-size:12.5px;color:var(--ink3);font-weight:600}
main{min-height:60vh;padding-bottom:70px}
.pagehead{padding:26px 0 6px}
.pagehead .lead{color:var(--ink2);margin-top:8px;max-width:66ch}

/* ---------- controls ---------- */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 16px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:8px;justify-content:center;text-decoration:none;color:var(--ink);transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--river)}
.btn.pri{background:var(--river);border-color:var(--river);color:var(--on-river)}
.btn.pri:hover{filter:brightness(1.1)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.danger{color:var(--flag);border-color:var(--flag-soft)}
.btn.sm{padding:6px 12px;font-size:13.5px}
.btn.lg{padding:13px 24px;font-size:16.5px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.linkbtn{border:0;background:none;padding:0;color:var(--river);font-weight:600;text-align:left;font-size:inherit}
.linkbtn:hover{text-decoration:underline}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:500;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px;width:100%}
input[type="file"]{padding:8px}
textarea{min-height:92px;resize:vertical}
label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
.field{margin-top:16px}
.field .hint{font-size:13px;color:var(--ink2);margin-top:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.split{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:24px;align-items:start}
.radios{display:grid;gap:10px;margin-top:8px}
.radio{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface);cursor:pointer}
.radio input{width:auto;margin:3px 0 0}
.radio[data-on="1"]{border-color:var(--river);background:var(--river-soft)}
.err{color:var(--flag);font-size:14px;font-weight:600;margin-top:12px}
.ok-note{background:var(--moss-soft);color:var(--moss);border-radius:10px;padding:12px 14px;font-size:14px;font-weight:500}
.warn-note{background:var(--gold-soft);color:var(--gold);border-radius:10px;padding:12px 14px;font-size:14px;font-weight:500}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card.pad0{padding:0;overflow:hidden}
.card h3+.muted{margin-top:6px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.tile .n{font-family:"Bricolage Grotesque",sans-serif;font-size:27px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.tile .k{font-size:13px;color:var(--ink2);margin-top:4px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.s-open{background:var(--river-soft);color:var(--river)}
.s-ready{background:var(--gold-soft);color:var(--gold)}
.s-evid{background:var(--line);color:var(--ink2)}
.s-review{background:var(--gold-soft);color:var(--gold)}
.s-verified{background:var(--moss-soft);color:var(--moss)}
.s-pending{background:var(--gold-soft);color:var(--gold)}
.s-rejected{background:var(--flag-soft);color:var(--flag)}
.s-approved{background:var(--moss-soft);color:var(--moss)}
.s-claimed{background:var(--river-soft);color:var(--river)}
.tag{display:inline-block;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:7px;background:var(--bg);color:var(--ink2);border:1px solid var(--line)}
.bar{height:9px;border-radius:5px;overflow:hidden;background:var(--line);display:flex}
.bar i{display:block;height:100%}

/* project cards */
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(315px,1fr));gap:16px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column;transition:border-color .15s,transform .15s}
.pcard:hover{border-color:var(--river);transform:translateY(-2px)}
.pcard .ph{aspect-ratio:16/8;background:var(--river-soft);position:relative;overflow:hidden}
.pcard .ph img{width:100%;height:100%;object-fit:cover;display:block}
.pcard .ph .status{position:absolute;left:10px;top:10px;background:var(--surface);color:var(--ink)}
.pcard .bd{padding:14px 15px 16px;display:flex;flex-direction:column;gap:9px;flex:1}
.pcard .ti{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:17px;line-height:1.2}
.thumb{aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:var(--river-soft)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}

/* table */
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th{text-align:left;font-size:12.5px;color:var(--ink3);font-weight:700;padding:0 12px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}
.scroll-x{overflow-x:auto}

/* map */
.mapbox{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.mapbox svg{display:block;width:100%;height:auto;touch-action:manipulation}
.mk{cursor:pointer}
.mk circle.hit{fill:transparent}
.maplegend{display:flex;gap:14px;flex-wrap:wrap;padding:11px 14px;border-top:1px solid var(--line);font-size:13px;color:var(--ink2);background:var(--raise)}
.maplegend span{display:inline-flex;align-items:center;gap:6px}
.maplegend i{width:10px;height:10px;border-radius:999px;display:block}
.maptip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);padding:7px 10px;border-radius:8px;font-size:12.5px;font-weight:600;transform:translate(-50%,-135%);white-space:nowrap;opacity:0;transition:opacity .12s;max-width:230px}
.maptip[data-on="1"]{opacity:1}

/* charts */
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:"Instrument Sans",sans-serif;fill:var(--ink2);font-size:11px}
.legend{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:7px}
.legend li{display:flex;align-items:center;gap:9px;font-size:13.5px}
.legend .sw{width:10px;height:10px;border-radius:3px;flex:none}
.legend .v{margin-left:auto;font-weight:600}

/* landing */
.hero{background:linear-gradient(175deg,var(--river-soft),var(--bg) 70%);border-bottom:1px solid var(--line);position:relative;overflow:hidden}
.hero-in{padding:56px 0 46px;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:40px;align-items:center}
.hero h1{max-width:15ch}
.hero .sub{font-size:19px;color:var(--ink2);margin-top:18px;max-width:52ch}
.hero .cta{display:flex;gap:12px;margin-top:26px;flex-wrap:wrap}
.hero .facts{display:flex;gap:26px;margin-top:34px;flex-wrap:wrap}
.hero .facts div span{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:26px;font-weight:700}
.hero .facts div small{color:var(--ink2);font-size:13px}
.sect{padding:56px 0}
.sect.alt{background:var(--surface);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.sect .kick{font-size:14px;color:var(--river);font-weight:700;margin-bottom:10px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:26px;counter-reset:s}
.step{border-top:2px solid var(--line);padding-top:14px;position:relative}
.step:before{counter-increment:s;content:counter(s);font-family:"Bricolage Grotesque",sans-serif;font-weight:700;color:var(--river);font-size:13px;display:block;margin-bottom:6px}
.step.on{border-top-color:var(--river)}
.roleboxes{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:24px}
.rolebox{border:1px solid var(--line);border-radius:var(--r);padding:20px;background:var(--surface)}
.rolebox .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;margin-bottom:12px}
.ul{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px;font-size:14.5px;color:var(--ink2)}
.ul li{display:flex;gap:9px;align-items:flex-start}
.ul li svg{color:var(--moss);flex:none;margin-top:5px}
.banner{background:var(--ink);color:var(--bg);border-radius:16px;padding:34px;display:flex;gap:24px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner h2{color:var(--surface)}
:root[data-theme="dark"] .banner h2,:root:not([data-theme="light"]) .banner h2{color:var(--ink)}
.foot{border-top:1px solid var(--line);background:var(--surface);padding:34px 0;font-size:14px;color:var(--ink2)}
.foot .cols{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:22px}
.foot h4{margin-bottom:10px;font-size:14px}
.foot button{display:block;border:0;background:none;padding:4px 0;color:var(--ink2);font-size:14px}
.foot button:hover{color:var(--river)}

/* modal */
.mask{position:fixed;inset:0;background:var(--overlay);display:grid;place-items:center;padding:18px;z-index:90;overflow:auto}
.modal{background:var(--surface);border-radius:16px;border:1px solid var(--line);max-width:560px;width:100%;padding:24px;box-shadow:var(--shadow);margin:auto;max-height:92vh;overflow:auto}
.modal.wide{max-width:760px}
.modal .x{float:right;border:0;background:none;color:var(--ink2);font-size:22px;line-height:1;padding:2px 6px;border-radius:6px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:14.5px;font-weight:600;opacity:0;transition:.22s;pointer-events:none;z-index:99;max-width:90vw;text-align:center}
#toast[data-on="1"]{opacity:1;transform:translateX(-50%) translateY(0)}

/* ticket + certificate */
.ticket{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface);display:grid;grid-template-columns:auto 1fr}
.ticket .qr{width:132px;height:132px;display:block;background:#fff;padding:8px}
.ticket .tb{padding:14px 16px}
.cert{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.cert svg{display:block;width:100%;height:auto}
.timeline{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:0}
.timeline li{display:grid;grid-template-columns:22px 1fr;gap:12px;padding-bottom:16px;position:relative}
.timeline li:not(:last-child):after{content:"";position:absolute;left:10px;top:20px;bottom:0;width:2px;background:var(--line)}
.timeline .dot{width:20px;height:20px;border-radius:999px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;z-index:1}
.timeline li[data-done="1"] .dot{background:var(--moss);border-color:var(--moss);color:#fff}
.photogrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.photogrid figure{margin:0}
.photogrid img{border-radius:10px;width:100%;aspect-ratio:16/10;object-fit:cover;display:block}
.photogrid figcaption{font-size:12.5px;color:var(--ink2);margin-top:6px}
.emptybox{border:1px dashed var(--line);border-radius:var(--r);padding:34px 20px;text-align:center;color:var(--ink2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14.5px}
.kv dt{color:var(--ink2)}
.kv dd{margin:0;font-weight:600;text-align:right}
.pill-row{display:flex;gap:8px;flex-wrap:wrap}
.sidebar{position:sticky;top:96px}
.demo-chip{background:var(--gold-soft);color:var(--gold);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:700}

@media (max-width:900px){
  .split,.grid3,.roleboxes{grid-template-columns:1fr}
  .steps,.grid4{grid-template-columns:1fr 1fr}
  .hero-in{grid-template-columns:1fr;padding:38px 0 34px}
  .foot .cols{grid-template-columns:1fr 1fr}
  .nav{position:fixed;left:0;right:0;top:calc(58px + env(safe-area-inset-top,0px));background:var(--surface);border-bottom:1px solid var(--line);flex-direction:column;padding:8px;gap:2px;display:none;box-shadow:var(--shadow);z-index:45}
  .nav[data-open="1"]{display:flex}
  .nav button{text-align:left;width:100%}
  .navtoggle{display:inline-grid;place-items:center;width:38px;height:38px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
  .modes button{padding:6px 10px;font-size:12.5px}
  .brand{font-size:20px}
  .only-sm{display:block;border:0;background:none;padding:8px 12px;border-radius:9px;font-weight:600;font-size:14.5px;color:var(--river);text-align:left;width:100%}
}
@media (max-width:620px){
  .grid2,.grid4,.steps,.photogrid,.foot .cols{grid-template-columns:1fr}
  .ticket{grid-template-columns:1fr}
  .ticket .qr{width:100%;height:auto;max-width:200px;margin:12px auto 0}
  .sect{padding:40px 0}
  .banner{padding:24px}
  .hide-sm{display:none}
  .top-in{gap:8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{.top,.foot,.noprint{display:none!important}body{background:#fff}}
</style>
</head>

      setupPositionProbePattern(0, 0);

/* ---------- session ---------- */
function me() { return DB.session ? userById(DB.session.userId) : null; }
function mode() { return DB.session ? DB.session.mode : null; }
function isStaff() { const u = me(); return !!(u && u.staff); }
function setMode(m) { if (!DB.session) return; DB.session.mode = m; state.tab = 'overview'; state.subtab = 'overview'; state.form = {}; save(); state.view = {name: m === 'organizer' ? 'org-home' : m === 'staff' ? 'staff-home' : 'sup-home'}; state.menu = false; render(); }
function login(email, pass) {
  const u = DB.users.find(x => x.email.toLowerCase() === String(email).trim().toLowerCase());
  if (!u) return 'No account uses that email. Check the address or create an account.';
  if (pass && u.pass !== pass) return 'That password does not match. Demo accounts use demo1234.';
  DB.session = {userId:u.id, mode: u.staff ? 'staff' : 'supporter'};
  attachGuestActivity(u);
  save(); return null;
}
function logout() { DB.session = null; state.menu = false; state.view = {name:'home'}; save(); render(); toast('Signed out'); }

/* Guest activity is matched to a new account by email or phone. */
function attachGuestActivity(u) {
  let n = 0;
  DB.projects.forEach(p => {
    (p.sponsors || []).forEach(s => { if (!s.userId && ((s.email && s.email.toLowerCase() === u.email.toLowerCase()) || (s.phone && s.phone === u.phone))) { s.userId = u.id; n++; } });
    (p.vols || []).forEach(v => { if (!v.userId && ((v.email && v.email.toLowerCase() === u.email.toLowerCase()) || (v.phone && v.phone === u.phone))) { v.userId = u.id; n++; } });
  });
  DB.reports.forEach(r => { if (!r.by.userId && ((r.by.email && r.by.email.toLowerCase() === u.email.toLowerCase()) || (r.by.phone && r.by.phone === u.phone))) { r.by.userId = u.id; n++; } });
  if (n) setTimeout(() => toast(n + ' earlier ' + (n === 1 ? 'action' : 'actions') + ' added to your account'), 700);
}

<script>
/* ============================================================

/* ---------- map ---------- */
const MAPB = {n:27.82, s:27.55, w:85.18, e:85.62, W:1000, H:620};
const mx = lng => (clamp(lng, MAPB.w, MAPB.e) - MAPB.w) / (MAPB.e - MAPB.w) * MAPB.W;
const my = lat => (MAPB.n - clamp(lat, MAPB.s, MAPB.n)) / (MAPB.n - MAPB.s) * MAPB.H;
const unx = x => MAPB.w + x / MAPB.W * (MAPB.e - MAPB.w);
const uny = y => MAPB.n - y / MAPB.H * (MAPB.n - MAPB.s);

const MAPBASE = `
<defs>
  <linearGradient id="mg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--river-soft)"/><stop offset="1" stop-color="var(--bg)"/></linearGradient>

</defs>
<rect width="1000" height="620" fill="url(#mg)"/>
<rect width="1000" height="620" fill="url(#hill)" opacity=".5"/>
<path d="M120 300C130 180 255 96 425 96C575 96 672 168 692 276C714 392 604 486 428 496C262 506 110 418 120 300Z" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>
<ellipse cx="800" cy="432" rx="128" ry="86" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>
<path d="M692 300C730 316 742 366 776 392" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="7 6"/>

<path d="M286 142C288 200 292 240 300 286C306 322 306 352 306 396" fill="none" stroke="#5ba0b0" stroke-width="5" stroke-linecap="round" opacity=".6"/>
<path d="M636 294C592 314 540 326 470 330C420 333 370 340 336 360" fill="none" stroke="#5ba0b0" stroke-width="5" stroke-linecap="round" opacity=".6"/>
<circle cx="338" cy="288" r="104" fill="none" stroke="var(--line)" stroke-width="3"/>
<circle cx="338" cy="288" r="52" fill="var(--river-soft)" opacity=".8"/>
<circle cx="568" cy="342" r="40" fill="var(--river-soft)" opacity=".8"/>
<circle cx="316" cy="340" r="44" fill="var(--river-soft)" opacity=".8"/>
<circle cx="790" cy="436" r="40" fill="var(--river-soft)" opacity=".8"/>
<g font-family="Instrument Sans,sans-serif" font-size="15" font-weight="600" fill="var(--ink2)">
  <text x="338" y="236" text-anchor="middle">Kathmandu</text>
  <text x="300" y="398" text-anchor="middle">Lalitpur</text>
  <text x="568" y="300" text-anchor="middle">Bhaktapur</text>
  <text x="790" y="392" text-anchor="middle">Kavre</text>
  <text x="252" y="548" font-size="13" fill="var(--ink3)">Bagmati</text>
  <text x="866" y="140" font-size="13" fill="var(--ink3)" text-anchor="end">Illustrative map, not to scale</text>
</g>`;

function mapMarker(p, i) {
  const c = CATS[p.cat] ? CATS[p.cat].color : 'var(--river)';
  const x = mx(p.lng), y = my(p.lat);
  const r = p.big ? 15 : 11;
  return `<g class="mk" data-mk="${esc(p.id)}" data-kind="${esc(p.kind || 'project')}" tabindex="0" role="button" aria-label="${esc(p.label)}">
    <circle cx="${x}" cy="${y}" r="${r + 9}" class="hit"/>
    <circle cx="${x}" cy="${y}" r="${r + 4}" fill="${c}" opacity=".18"/>
    <circle cx="${x}" cy="${y}" r="${r}" fill="${c}" stroke="var(--surface)" stroke-width="3"/>
    ${p.n != null ? `<text x="${x}" y="${y + 4}" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">${esc(p.n)}</text>` : ''}
  </g>`;
}
/* points: {id,lat,lng,label,cat,kind,n}  opts: {pick:true, height} */
function mapHtml(points, opts) {
  opts = opts || {};
  const marks = points.map(mapMarker).join('');
  const pin = opts.pin ? `<g><path d="M${mx(opts.pin.lng)} ${my(opts.pin.lat)} l-11 -18 a13 13 0 1 1 22 0 z" fill="var(--flag)" stroke="var(--surface)" stroke-width="2"/><circle cx="${mx(opts.pin.lng)}" cy="${my(opts.pin.lat) - 22}" r="4.5" fill="#fff"/></g>` : '';
  const legend = opts.legend === false ? '' : `<div class="maplegend">${Object.entries(CATS).map(([k, c]) => `<span><i style="background:${c.color}"></i>${esc(c.short)}</span>`).join('')}${opts.extraLegend || ''}</div>`;
  return `<div class="mapbox" ${opts.pick ? 'data-pickmap="1"' : ''}>
    <svg viewBox="0 0 1000 620" role="img" aria-label="Map of project locations in and around the Kathmandu valley">${MAPBASE}${marks}${pin}</svg>
    <div class="maptip" id="maptip"></div>
    ${opts.pick ? '<div class="maplegend">Tap the map to drop a pin on the spot</div>' : legend}
  </div>`;
}
function projPoints(list, opts) {
  return list.map(p => ({id:p.id, lat:p.lat, lng:p.lng, cat:p.cat, label:p.title + ' — ' + p.place, kind:(opts && opts.kind) || 'project'}));
}

/* ---------- charts (inline SVG) ---------- */
function donut(data, opts) {
  opts = opts || {};
  const all = data.slice();
  data = data.filter(d => d.v > 0);
  if (!data.length) data = all.slice(0, 1).map(d => Object.assign({}, d, {v:0}));
  const total = data.reduce((a, d) => a + d.v, 0) || 1;
  let a0 = -Math.PI / 2, seg = '';
  const cx = 90, cy = 90, R = 78, r = 50;
  data.forEach(d => {
    const a1 = a0 + d.v / total * Math.PI * 2;
    if (d.v > 0) {
      const large = a1 - a0 > Math.PI ? 1 : 0;
      seg += `<path d="M${cx + R * Math.cos(a0)} ${cy + R * Math.sin(a0)} A${R} ${R} 0 ${large} 1 ${cx + R * Math.cos(a1)} ${cy + R * Math.sin(a1)} L${cx + r * Math.cos(a1)} ${cy + r * Math.sin(a1)} A${r} ${r} 0 ${large} 0 ${cx + r * Math.cos(a0)} ${cy + r * Math.sin(a0)} Z" fill="${d.c}"><title>${esc(d.k)}: ${esc(d.t || d.v)}</title></path>`;
    }
    a0 = a1;
  });
  return `<div class="chart" style="display:flex;gap:20px;align-items:center;flex-wrap:wrap">
    <svg viewBox="0 0 180 180" style="width:170px;flex:none">${seg}
      <text x="90" y="86" text-anchor="middle" font-size="13" fill="var(--ink2)">${esc(opts.label || 'Total')}</text>
      <text x="90" y="108" text-anchor="middle" font-size="19" font-weight="700" fill="var(--ink)" font-family="Bricolage Grotesque,sans-serif">${esc(opts.center || num(total))}</text>
    </svg>
    <ul class="legend" style="flex:1;min-width:180px;margin:0">${data.map(d => `<li><i class="sw" style="background:${d.c}"></i>${esc(d.k)}<span class="v">${esc(d.t || num(d.v))}</span></li>`).join('')}</ul>
  </div>`;
}
function bars(data, opts) {
  opts = opts || {};
  const W = 560, H = opts.h || 200, pad = 34, bw = (W - pad - 12) / data.length;
  const max = Math.max(1, ...data.map(d => d.v));
  const bodies = data.map((d, i) => {
    const h = d.v / max * (H - 44), x = pad + i * bw + bw * .18, y = H - 26 - h;
    return `<g><rect x="${x}" y="${y}" width="${bw * .64}" height="${Math.max(h, 1)}" rx="4" fill="${d.c || 'var(--river)'}"><title>${esc(d.k)}: ${esc(d.t || num(d.v))}</title></rect>
      <text x="${x + bw * .32}" y="${H - 9}" text-anchor="middle" font-size="11">${esc(d.k)}</text>
      ${opts.values !== false ? `<text x="${x + bw * .32}" y="${y - 6}" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink)">${esc(d.t || num(d.v))}</text>` : ''}</g>`;
  }).join('');
  const grid = [0, .5, 1].map(f => `<line x1="${pad}" x2="${W}" y1="${H - 26 - f * (H - 44)}" y2="${H - 26 - f * (H - 44)}" stroke="var(--line)" stroke-width="1"/>`).join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}">${grid}${bodies}</svg></div>`;
}
function areaLine(points, opts) {
  opts = opts || {};
  const W = 560, H = opts.h || 210, pad = 40, bot = H - 28;
  const max = Math.max(1, ...points.map(p => p.v));
  const X = i => pad + i * (W - pad - 10) / Math.max(1, points.length - 1);
  const Y = v => bot - v / max * (bot - 18);
  const line = points.map((p, i) => `${i ? 'L' : 'M'}${X(i)} ${Y(p.v)}`).join(' ');
  const area = line + ` L${X(points.length - 1)} ${bot} L${X(0)} ${bot} Z`;
  const dots = points.map((p, i) => `<g><circle cx="${X(i)}" cy="${Y(p.v)}" r="4" fill="var(--river)" stroke="var(--surface)" stroke-width="2"><title>${esc(p.k)}: ${esc(p.t || num(p.v))}</title></circle><text x="${X(i)}" y="${H - 8}" text-anchor="middle" font-size="11">${esc(p.k)}</text></g>`).join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}">
    <line x1="${pad}" x2="${W}" y1="${bot}" y2="${bot}" stroke="var(--line)"/>
    <line x1="${pad}" x2="${W}" y1="${Y(max)}" y2="${Y(max)}" stroke="var(--line)" stroke-dasharray="4 4"/>
    <text x="4" y="${Y(max) + 4}" font-size="11">${esc(opts.maxLabel || num(max))}</text>
    <path d="${area}" fill="var(--river)" opacity=".13"/><path d="${line}" fill="none" stroke="var(--river)" stroke-width="2.5" stroke-linejoin="round"/>${dots}</svg></div>`;
}
function hbars(data) {
  const max = Math.max(1, ...data.map(d => d.v));
  return `<div class="stack-s">${data.map(d => `<div>
    <div class="row between small"><span>${esc(d.k)}</span><b>${esc(d.t || num(d.v))}</b></div>
    <div class="bar" style="margin-top:5px"><i style="width:${d.v / max * 100}%;background:${d.c || 'var(--river)'}"></i></div>
  </div>`).join('')}</div>`;
}

/* ---------- funding split bar ---------- */
function fundBar(p) {
  const r = raised(p), g = p.goal, fill = pct(r, g);
  return `<div><div class="bar"><i style="width:${fill}%;background:${r >= g ? 'var(--moss)' : 'var(--river)'}"></i></div>
    <div class="row between small muted" style="margin-top:7px"><span><b class="b" style="color:var(--ink)">${rs(r)}</b> of ${rs(g)}</span><span>${fill}%</span></div></div>`;
}

/* ---------- QR ticket ---------- */
function qrObj(text) {
  const mk = lvl => { const q = qrcode(0, lvl); q.addData(text); q.make(); return q; };
  try { return mk(text.length > 300 ? 'L' : 'M'); } catch (e) { return mk('L'); }
}
function qrSvg(text, label) {
  const q = qrObj(text), n = q.getModuleCount(); let d = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c + 4} ${r + 4}h1v1h-1z`;
  return `<svg class="qr" viewBox="0 0 ${n + 8} ${n + 8}" role="img" aria-label="${esc(label || 'QR code')}" shape-rendering="crispEdges"><rect width="${n + 8}" height="${n + 8}" fill="#fff"/><path d="${d}" fill="#10242A"/></svg>`;
}
function ticketHtml(p, v) {
  return `<div class="ticket">
    ${qrSvg(v.code, 'Volunteer ticket ' + v.code)}
    <div class="tb stack-s">
      <div class="small muted">Volunteer ticket</div>
      <h3>${esc(p.title)}</h3>
      <div class="small muted">${ICONS.cal} ${fdate(p.date)} &nbsp; ${ICONS.pin} ${esc(p.place)}</div>
      <div class="pill-row"><span class="tag">${esc(v.name)}</span><span class="tag">${v.kind === 'organization' ? v.people + ' people' : '1 person'}</span><span class="tag">${esc(v.code)}</span></div>
      ${v.checkedIn ? `<div class="small" style="color:var(--moss);font-weight:600">${CHECK} Checked in: ${v.checkedIn} of ${v.people}</div>` : '<div class="small muted">Show this code to the organizer on the day.</div>'}
    </div></div>`;
}

    <text x="450" y="342" text-anchor="middle" font-size="24" font-weight="600" fill="#10242A">${esc(o.project)}</text>
    <text x="450" y="376" text-anchor="middle" font-size="15" fill="#4B6166">${esc(o.place)} · ${esc(o.date)}</text>

    <text x="450" y="444" text-anchor="middle" font-size="14" fill="#4B6166">Verified result</text>
    <text x="450" y="476" text-anchor="middle" font-size="22" font-weight="700" fill="#33754A" font-family="Bricolage Grotesque, sans-serif">${esc(o.result)}</text>

    <text x="830" y="574" text-anchor="end" font-size="13" fill="#748A8E">terra.example/verify/${esc(o.id)}</text>
  </svg>`;
}
function svgToPng(svgString, w, h, filename) {
  const img = new Image();
  img.onload = () => {
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, h); cx.drawImage(img, 0, 0, w, h);
    cv.toBlob(b => { if (b) dl(b, filename); }, 'image/png');
  };
  img.onerror = () => toast('Could not build the image here. Use Print instead.');
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgString);
}
function dl(blob, filename) {
  const u = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = u; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 4000); toast('Downloaded ' + filename);
}
function copyText(text, msg) {
  const done = () => toast(msg || 'Copied');
  const fb = () => { const t = document.createElement('textarea'); t.value = text; t.style.position = 'fixed'; t.style.opacity = '0';
    document.body.appendChild(t); t.select(); try { document.execCommand('copy'); done(); } catch (e) { toast('Copy did not work here'); } t.remove(); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fb); else fb();
}

function empty(title, body, btn) {

function toast(msg) {

/* ---------- aggregate stats ---------- */
function stats() {
  const live = DB.projects.filter(p => !['pending','rejected'].includes(p.status));
  const verified = DB.projects.filter(p => p.status === 'verified');
  const funds = live.reduce((a, p) => a + raised(p), 0);
  const kg = verified.reduce((a, p) => a + (p.ev && p.cat !== 'trees' ? p.ev.achieved : 0), 0);
  const ha = verified.reduce((a, p) => a + (p.ev && p.cat === 'trees' ? p.ev.achieved : 0), 0);
  const vols = live.reduce((a, p) => a + volCount(p), 0);
  const sponsors = new Set(); live.forEach(p => (p.sponsors || []).forEach(s => sponsors.add(s.userId || s.name)));
  return {live, verified, funds, kg, ha, vols, sponsorCount:sponsors.size, reports:DB.reports.length};
}

    <div class="card stack">
      <h3>Where the money goes</h3>
      <p class="muted">Terra keeps ${Math.round(FEE * 100)}% of each sponsorship to run the platform and the review team. Of the rest, ${Math.round(UPFRONT * 100)}% goes to the organizer when the project is fully funded so they can buy tools, sacks and transport, and the remainder is released after verification.</p>
      ${hbars([{k:'To the organizer after verification', v:(1 - FEE) * (1 - UPFRONT) * 100, t:Math.round((1 - FEE) * (1 - UPFRONT) * 100) + '%', c:'var(--moss)'},
               {k:'To the organizer upfront for costs', v:(1 - FEE) * UPFRONT * 100, t:Math.round((1 - FEE) * UPFRONT * 100) + '%', c:'var(--river)'},
               {k:'Terra platform fee', v:FEE * 100, t:Math.round(FEE * 100) + '%', c:'var(--gold)'}])}
    </div>
    <div class="grid4">
      ${tile(num(s.live.length), 'Projects listed')}${tile(num(s.verified.length), 'Verified so far')}
      ${tile(num(s.sponsorCount), 'Sponsors')}${tile(num(s.reports), 'Sites reported')}
    </div>
    <div class="card stack">
      <h3>The team</h3>
      <div class="grid3">${ORGINFO.team.map(t => `<div><div class="avatar" style="width:44px;height:44px;font-size:16px">${esc(initials(t.n))}</div><div class="b mt">${esc(t.n)}</div><div class="small muted">${esc(t.r)}</div></div>`).join('')}</div>
      <p class="tiny muted">Team details are placeholders in this prototype.</p>
    </div>
    <div class="card stack">
      <h3>Talk to us</h3>
      <p class="muted">${esc(ORGINFO.email)} · ${esc(ORGINFO.phone)} · ${esc(ORGINFO.address)}</p>
      <div><button class="btn pri" data-go="contact">Send a message</button></div>
    </div>
  </div></main>${footer()}`;
}

function contact() {
  const f = state.form;
  return `${header()}<main><div class="wrap narrow pagehead">
    <h1>Contact Terra</h1>
    <p class="lead">Questions about sponsoring, organizing or verification. We reply within two working days.</p>
  </div>
  <div class="wrap narrow mt">
    <div class="split">
      <form class="card" data-form="contact">

        <div class="field"><label for="cs">Subject</label>
          <select id="cs" name="subject">
            <option>Sponsoring a project</option><option>Organizing a project</option>
            <option>Reporting a site</option><option>Verification question</option><option>Something else</option>

        ${state.err ? `<p class="err">${esc(state.err)}</p>` : ''}
        <div class="mt"><button class="btn pri" type="submit">Send message</button></div>
      </form>
      <div class="stack">
        <div class="card stack-s"><h3>Office</h3><p class="small muted">${esc(ORGINFO.address)}</p>

          <p class="tiny muted">Contact details are placeholders in this prototype.</p></div>
        <div class="card stack-s"><h3>Faster routes</h3>
          <button class="linkbtn" data-go="report-new">Report a site that needs work</button>
          <button class="linkbtn" data-go="org-start">Apply to organize a project</button>
          <button class="linkbtn" data-go="about">Read how verification works</button></div>

}

/* ============================================================
   Sign in and sign up
   ============================================================ */
function demoRow() {
  return `<div class="card stack-s" style="background:var(--raise)">
    <div class="row between"><h4>Demo accounts</h4><span class="demo-chip">One tap</span></div>
    <p class="tiny muted">Password for all demo accounts is demo1234.</p>
    <div class="row">
      <button class="btn sm" data-demo="maya@demo.terra">Maya, sponsor and volunteer</button>
      <button class="btn sm" data-demo="bikash@demo.terra">Bikash, organizer</button>
      <button class="btn sm" data-demo="team@demo.terra">Anjali, Terra team</button>
    </div></div>`;
}
function loginView() {
  const f = state.form;
  return `${header()}<main><div class="wrap narrow pagehead"><h1>Sign in</h1>
    <p class="lead">Your sponsorships, volunteer tickets and certificates are kept here.</p></div>
    <div class="wrap narrow stack mt">
      <form class="card" data-form="login">

      </form>
      ${demoRow()}

}
function signupView() {
  const f = state.form;
  const kind = f.kind || 'individual';
  return `${header()}<main><div class="wrap narrow pagehead"><h1>Create your Terra account</h1>
    <p class="lead">One account covers sponsoring, volunteering and, when you are ready, organizing your own project.</p></div>
    <div class="wrap narrow stack mt">
      <form class="card" data-form="signup">
        <label>I am signing up as</label>
        <div class="radios">
          <label class="radio" data-on="${kind === 'individual' ? 1 : 0}"><input type="radio" name="kind" value="individual" ${kind === 'individual' ? 'checked' : ''}>
            <span><b>A person</b><br><span class="small muted">Sponsor or volunteer under your own name</span></span></label>
          <label class="radio" data-on="${kind === 'organization' ? 1 : 0}"><input type="radio" name="kind" value="organization" ${kind === 'organization' ? 'checked' : ''}>
            <span><b>An organization</b><br><span class="small muted">A business, college, club or community group</span></span></label>
        </div>
        <div class="field"><label for="sn">${kind === 'organization' ? 'Organization name' : 'Full name'}</label><input id="sn" name="name" value="${esc(f.name || '')}" required></div>
        ${kind === 'organization' ? `<div class="field"><label for="sc">Contact person</label><input id="sc" name="contact" value="${esc(f.contact || '')}" placeholder="Name of the person we should talk to"></div>` : ''}
        <div class="grid2">
          <div class="field"><label for="se">Email</label><input id="se" name="email" type="email" value="${esc(f.email || '')}" required></div>
          <div class="field"><label for="sp">Phone</label><input id="sp" name="phone" value="${esc(f.phone || '')}" placeholder="+977 98…" required></div>
        </div>
        <div class="field"><label for="sw">Password</label><input id="sw" name="pass" type="password" value="${esc(f.pass || '')}" required>
          <p class="hint">Simulated sign up. Nothing is sent anywhere and the account lives in this browser only.</p></div>
        <label class="radio mt" data-on="0" style="align-items:center"><input type="checkbox" name="organizer" ${f.organizer ? 'checked' : ''}>
          <span><b>I also want to organize projects</b><br><span class="small muted">You can switch this on later from your account</span></span></label>
        ${state.err ? `<p class="err">${esc(state.err)}</p>` : ''}
        <div class="mt"><button class="btn pri block" type="submit">Create account</button></div>
        <p class="small muted mt">Already have one? <button class="linkbtn" data-go="login" type="button">Sign in</button></p>
      </form>
      ${demoRow()}
    </div></main>${footer()}`;
}
</script>
<script>
/* ============================================================
   Browse projects
   ============================================================ */
function visibleProjects() {
  const f = state.filter;
  return DB.projects.filter(p => !['pending','rejected'].includes(p.status))
    .filter(p => f.cat === 'all' || p.cat === f.cat)
    .filter(p => f.district === 'all' || p.district === f.district)
    .filter(p => !f.open || p.status === 'funding')
    .filter(p => !f.q || (p.title + ' ' + p.place + ' ' + p.org + ' ' + p.desc).toLowerCase().includes(f.q.toLowerCase()));
}
function projects() {
  const list = visibleProjects(), f = state.filter;
  const chip = (key, val, label) => `<button class="chip" data-filter="${key}" data-val="${val}" aria-pressed="${f[key] === val}">${esc(label)}</button>`;
  return `${header()}<main><div class="wrap pagehead">
    <h1>Projects</h1>
    <p class="lead">Every project here has been approved by the Terra team. Sponsor it, join as a volunteer, or both. No account needed.</p>
  </div>
  <div class="wrap mt">
    <div class="card stack">
      <div class="row">
        <input style="max-width:320px" placeholder="Search by place, group or title" value="${esc(f.q)}" data-search="1" aria-label="Search projects">
        <span class="spacer"></span>
        <div class="modes"><button data-vw="grid" aria-pressed="${f.view === 'grid'}">List</button><button data-vw="map" aria-pressed="${f.view === 'map'}">Map</button></div>
      </div>
      <div class="chips">${chip('cat','all','All work')}${Object.entries(CATS).map(([k, c]) => chip('cat', k, c.label)).join('')}</div>
      <div class="chips">${chip('district','all','Everywhere')}${Object.keys(DISTRICTS).map(d => chip('district', d, d)).join('')}
        <button class="chip" data-filter="open" data-val="toggle" aria-pressed="${f.open}">Open for funding only</button></div>
    </div>
    <p class="small muted mt">${list.length} project${list.length === 1 ? '' : 's'}</p>
    ${f.view === 'map'
      ? `<div class="mt">${mapHtml(projPoints(list))}</div><div class="plist mt2">${list.map(projectCard).join('')}</div>`
      : `<div class="plist mt">${list.map(projectCard).join('') || empty('Nothing matches those filters', 'Try clearing the filters or searching for a different place.')}</div>`}
  </div></main>${footer()}`;
}

/* ============================================================
   Project detail
   ============================================================ */
function stageDone(p) {
  const after = ['evidence','review','verified'].includes(p.status);
  return [!['pending','rejected'].includes(p.status), raised(p) >= p.goal || after, volCount(p) >= p.needed || after,
          after, p.status === 'review' || p.status === 'verified', p.status === 'verified', p.status === 'verified'];
}
function moneySplit(p) {
  const r = raised(p);
  return {fee: r * FEE, up: r * (1 - FEE) * UPFRONT, rest: r * (1 - FEE) * (1 - UPFRONT)};
}
function projectView(p) {
  if (!p) return notFound();
  const c = CATS[p.cat], r = raised(p), done = stageDone(p), u = me();
  const ms = moneySplit(p);
  const orgUser = userById(p.ownerId);
  const myVol = u ? (p.vols || []).find(v => v.userId === u.id) : null;
  const mySpon = u ? (p.sponsors || []).filter(s => s.userId === u.id) : [];
  const canFund = ['funding','ready'].includes(p.status);
  const canVol = ['funding','ready'].includes(p.status);
  const sponsorRows = (p.sponsors || []).slice().sort((a, b) => b.amount - a.amount);

  return `${header()}<main><div class="wrap pagehead">
    <button class="linkbtn small" data-go="projects">← All projects</button>
    <div class="row between mt" style="align-items:flex-start">
      <div style="flex:1;min-width:260px">
        <div class="row" style="gap:8px">${statusPill(p.status)}<span class="tag">${esc(c.label)}</span></div>
        <h1 style="margin-top:12px">${esc(p.title)}</h1>
        <p class="lead">Organized by ${esc(p.org)}${orgUser && orgUser.orgProfile && orgUser.orgProfile.verified ? ' · <span style="color:var(--moss);font-weight:600">Verified organizer</span>' : ''}</p>
      </div>
    </div>
  </div>
  <div class="wrap mt"><div class="split">
    <div class="stack">
      <div class="thumb"><img src="${p.cover || coverPhoto(p.cat, p.id.length + p.title.length)}" alt=""></div>
      <div class="card stack">
        <h3>What will happen</h3>
        <p class="muted">${esc(p.desc)}</p>
        <div class="grid2 mt">
          <div><div class="small muted">Where</div><div class="b">${esc(p.place)}, ${esc(p.district)}</div></div>
          <div><div class="small muted">When</div><div class="b">${fdate(p.date)}</div></div>
          <div><div class="small muted">Scope</div><div class="b">${esc(p.scope)}</div></div>
          <div><div class="small muted">Target result</div><div class="b">${esc(c.phrase(p.target))}</div></div>
        </div>
      </div>
      <div class="card stack"><h3>Location</h3>
        ${mapHtml([{id:p.id, lat:p.lat, lng:p.lng, cat:p.cat, label:p.place, big:true}], {legend:false})}
        <p class="small muted">Approximate location. The exact meeting point is sent to volunteers a day before.</p></div>

      <div class="card stack">
        <h3>Progress</h3>
        <ul class="timeline">${STAGES.map((s, i) => `<li data-done="${done[i] ? 1 : 0}"><span class="dot">${done[i] ? CHECK : ''}</span>
          <div><div class="b">${esc(s)}</div>${i === 1 && !done[1] ? `<div class="small muted">${rs(p.goal - r)} still needed</div>` : ''}${i === 2 && !done[2] ? `<div class="small muted">${Math.max(0, p.needed - volCount(p))} more volunteers wanted</div>` : ''}</div></li>`).join('')}</ul>
      </div>

      ${p.status === 'verified' ? impactBlock(p) : p.ev ? evidenceBlock(p) : ''}

      <div class="card stack">
        <h3>Budget and money flow</h3>
        <p class="small muted">${esc(p.budget || 'Budget breakdown provided by the organizer.')}</p>
        ${hbars([
          {k:'Released to the organizer after verification', v:ms.rest, t:rs(ms.rest), c:'var(--moss)'},
          {k:'Released upfront once fully funded', v:ms.up, t:rs(ms.up), c:'var(--river)'},
          {k:`Terra platform fee (${Math.round(FEE * 100)}%)`, v:ms.fee, t:rs(ms.fee), c:'var(--gold)'}])}
        <p class="tiny muted">Based on ${rs(r)} raised so far.</p>
      </div>

      <div class="card stack">
        <div class="row between"><h3>Sponsors</h3><span class="small muted">${sponsorRows.length} so far</span></div>
        ${sponsorRows.length ? `<div class="scroll-x"><table class="tbl"><thead><tr><th>Sponsor</th><th>Type</th><th>Date</th><th class="r">Amount</th></tr></thead><tbody>
          ${sponsorRows.map(s => `<tr><td>${esc(s.anon ? 'Anonymous' : s.name)}</td><td class="muted">${s.kind === 'organization' ? 'Organization' : 'Person'}</td><td class="muted">${fdate(s.date)}</td><td class="r b">${rs(s.amount)}</td></tr>`).join('')}
        </tbody></table></div>` : '<p class="muted small">No sponsors yet. The first one gets the project moving.</p>'}
      </div>

      <div class="card stack">
        <div class="row between"><h3>Volunteers</h3><span class="small muted">${volCount(p)} of ${p.needed} places</span></div>
        <div class="bar"><i style="width:${pct(volCount(p), p.needed)}%;background:var(--river)"></i></div>
        ${(p.vols || []).length ? `<div class="scroll-x"><table class="tbl"><thead><tr><th>Name</th><th>Type</th><th class="r">People</th></tr></thead><tbody>
          ${p.vols.map(v => `<tr><td>${esc(v.name)}</td><td class="muted">${v.kind === 'organization' ? 'Organization' : 'Individual'}</td><td class="r b">${v.people}</td></tr>`).join('')}
        </tbody></table></div>` : '<p class="muted small">No one has signed up yet.</p>'}
      </div>
    </div>

    <aside class="stack sidebar">
      <div class="card stack">
        ${canFund ? `${fundBar(p)}
          <div class="row small muted"><span>${(p.sponsors || []).length} sponsors</span><span class="spacer"></span><span>${p.status === 'ready' ? 'Fully funded' : rs(p.goal - r) + ' to go'}</span></div>
          <button class="btn pri block lg" data-act="sponsor" data-id="${p.id}">Sponsor this project</button>
          <button class="btn block" data-act="volunteer" data-id="${p.id}">${myVol ? 'Add another volunteer sign up' : 'Volunteer'}</button>`
        : `<div class="ok-note">${p.status === 'verified' ? 'This project is finished and verified.' : 'Funding is closed. The work is being carried out or checked.'}</div>
           ${fundBar(p)}`}
        <p class="tiny muted">You can take part without an account. Sign in to keep your history and certificates.</p>
      </div>

      ${myVol ? `<div class="card stack-s"><h4>Your volunteer ticket</h4>${ticketHtml(p, myVol)}</div>` : ''}
      ${mySpon.length ? `<div class="card stack-s"><h4>You have sponsored this</h4>
        ${mySpon.map(s => `<div class="row between small"><span class="muted">${fdate(s.date)}</span><b>${rs(s.amount)}</b></div>`).join('')}
        ${p.status === 'verified' ? `<button class="btn sm block" data-act="cert" data-kind="sponsor" data-id="${p.id}" data-sid="${mySpon[0].id}">View your certificate</button>` : '<p class="tiny muted">Your certificate is issued once the work is verified.</p>'}</div>` : ''}

      <div class="card stack-s">
        <h4>Organizer</h4>
        <div class="row"><span class="avatar">${esc(initials(p.org))}</span><div><div class="b">${esc(p.org)}</div>
          <div class="small muted">${orgUser && orgUser.orgProfile ? esc(orgUser.orgProfile.ward) : esc(p.district)}</div></div></div>
        ${orgUser && orgUser.orgProfile ? `<p class="small muted">${esc(orgUser.orgProfile.about)}</p>` : ''}
        <div class="small muted">${DB.projects.filter(x => x.ownerId === p.ownerId && x.status === 'verified').length} verified projects on Terra</div>
      </div>

      <div class="card stack-s"><h4>Share</h4>
        <button class="btn sm block" data-act="share" data-id="${p.id}">Copy project link</button>
        <p class="tiny muted">Prototype links point at this page.</p></div>
    </aside>
  </div></div></main>${footer()}`;
}

function evidenceBlock(p) {
  return `<div class="card stack">
    <div class="row between"><h3>Evidence sent by the organizer</h3>${statusPill(p.status)}</div>
    <div class="photogrid">
      <figure><img src="${p.ev.before}" alt="Before the work"><figcaption>Before · ${ftime(p.ev.stamps.before)}</figcaption></figure>
      <figure><img src="${p.ev.after}" alt="After the work"><figcaption>After · ${ftime(p.ev.stamps.after)}</figcaption></figure>
    </div>
    <dl class="kv mt"><dt>Reported result</dt><dd>${esc(CATS[p.cat].phrase(p.ev.achieved))}</dd>
      <dt>People on the day</dt><dd>${p.ev.participants}</dd>
      <dt>Location stamp</dt><dd>${p.ev.lat.toFixed(4)}, ${p.ev.lng.toFixed(4)}</dd></dl>
    <p class="small muted">${esc(p.ev.note)}</p>
    <div class="warn-note">The Terra team is checking this evidence. Nothing is counted as verified until that is done.</div>
  </div>`;
}
function impactBlock(p) {
  const c = CATS[p.cat], ev = p.ev;
  return `<div class="card stack">
    <div class="row between"><h3>Impact report</h3><span class="status s-verified">${CHECK} Verified ${fdate(p.verified.at)}</span></div>
    <div class="photogrid">
      <figure><img src="${ev.before}" alt="Before the work"><figcaption>Before · ${ftime(ev.stamps.before)}</figcaption></figure>
      <figure><img src="${ev.after}" alt="After the work"><figcaption>After · ${ftime(ev.stamps.after)}</figcaption></figure>
    </div>
    <div class="grid3 mt">
      ${tile(esc(c.phrase(ev.achieved)), c.outcome, 'var(--moss)')}
      ${tile(ev.participants, 'People on the day')}
      ${tile(rs(raised(p)), 'Funded by ' + (p.sponsors || []).length + ' sponsors')}
    </div>
    <dl class="kv mt"><dt>Checked by</dt><dd>${esc(p.verified.by)}</dd>
      <dt>Location stamp</dt><dd>${ev.lat.toFixed(4)}, ${ev.lng.toFixed(4)} (${esc(ev.locSrc)})</dd>
      <dt>Cost per ${esc(c.unit)}</dt><dd>${rs(raised(p) / Math.max(ev.achieved, .01))}</dd></dl>
    <p class="small muted">${esc(p.verified.note || ev.note)}</p>
  </div>`;
}
function notFound() {
  return `${header()}<main><div class="wrap narrow pagehead"><h1>Page not found</h1>
    <p class="lead">That item is not here. It may have been reset with the demo data.</p>
    <div class="mt"><button class="btn pri" data-go="home">Back to the home page</button></div></div></main>${footer()}`;
}

/* ============================================================
   Sponsor and volunteer modals
   ============================================================ */
function sponsorModal(p) {
  const f = state.form, u = me();
  const kind = f.kind || (u && u.kind === 'organization' ? 'organization' : 'individual');
  const amount = Number(f.amount || 1000);
  const presets = [500, 1000, 5000, 25000];
  const fee = amount * FEE;
  return `<div class="modal stack">
    <button class="x" data-act="close" aria-label="Close">×</button>
    <h2>Sponsor this project</h2>
    <p class="muted small">${esc(p.title)} · ${esc(p.place)}</p>
    <form data-form="sponsor" data-id="${p.id}">
      <label>Amount</label>
      <div class="chips">${presets.map(v => `<button type="button" class="chip" data-amt="${v}" aria-pressed="${amount === v}">${rs(v)}</button>`).join('')}</div>
      <div class="field"><label for="amt">Or enter an amount</label><input id="amt" name="amount" type="number" min="100" step="100" value="${amount}" required>
        <p class="hint">${rs(amount - fee)} goes to the work, ${rs(fee)} is the Terra fee. Released in stages.</p></div>
      <label class="mt">Sponsoring as</label>
      <div class="radios">
        <label class="radio" data-on="${kind === 'individual' ? 1 : 0}"><input type="radio" name="kind" value="individual" data-live="1" ${kind === 'individual' ? 'checked' : ''}>
          <span><b>An individual</b><br><span class="small muted">The certificate carries your name</span></span></label>
        <label class="radio" data-on="${kind === 'organization' ? 1 : 0}"><input type="radio" name="kind" value="organization" data-live="1" ${kind === 'organization' ? 'checked' : ''}>
          <span><b>An organization</b><br><span class="small muted">The certificate carries the organization name</span></span></label>
      </div>
      <div class="field"><label for="sname">${kind === 'organization' ? 'Organization name' : 'Your name'}</label>
        <input id="sname" name="name" value="${esc(f.name != null ? f.name : (u ? (u.kind === 'organization' ? u.orgName || u.name : u.name) : ''))}" required></div>
      ${u ? '' : `<div class="grid2">
        <div class="field"><label for="semail">Email</label><input id="semail" name="email" type="email" value="${esc(f.email || '')}" required></div>
        <div class="field"><label for="sphone">Phone</label><input id="sphone" name="phone" value="${esc(f.phone || '')}"></div>
      </div><p class="hint">Used for your receipt, and to attach this to an account if you create one later.</p>`}
      <label class="radio mt" data-on="0" style="align-items:center"><input type="checkbox" name="anon" ${f.anon ? 'checked' : ''}>
        <span>Show me as Anonymous on the project page</span></label>
      ${state.err ? `<p class="err">${esc(state.err)}</p>` : ''}
      <div class="row mt"><button class="btn pri" type="submit">Confirm ${rs(amount)}</button><button class="btn" type="button" data-act="close">Cancel</button></div>
      <p class="tiny muted mt">Simulated payment. No money moves in this prototype.</p>
    </form></div>`;
}
function volunteerModal(p) {
  const f = state.form, u = me();
  const kind = f.kind || 'individual';
  return `<div class="modal stack">
    <button class="x" data-act="close" aria-label="Close">×</button>

          <span><b>Just me</b><br><span class="small muted">One name and one phone number</span></span></label>
        <label class="radio" data-on="${kind === 'organization' ? 1 : 0}"><input type="radio" name="kind" value="organization" data-live="1" ${kind === 'organization' ? 'checked' : ''}>

      ${kind === 'organization' ? `<div class="grid2">
        <div class="field"><label for="vpeople">How many people are coming?</label><input id="vpeople" name="people" type="number" min="2" max="500" value="${esc(f.people || 10)}" required></div>
        <div class="field"><label for="vcontact">Contact person</label><input id="vcontact" name="contact" value="${esc(f.contact || '')}" placeholder="Who leads the group" required></div>
      </div>` : ''}
      <div class="grid2">
        <div class="field"><label for="vphone">Phone number${kind === 'organization' ? ' of the contact person' : ''}</label>
          <input id="vphone" name="phone" value="${esc(f.phone != null ? f.phone : (u ? u.phone : ''))}" required></div>
        ${u ? '' : `<div class="field"><label for="vemail">Email (optional)</label><input id="vemail" name="email" type="email" value="${esc(f.email || '')}"></div>`}
      </div>
      ${state.err ? `<p class="err">${esc(state.err)}</p>` : ''}
      <div class="row mt"><button class="btn pri" type="submit">Get the ticket</button><button class="btn" type="button" data-act="close">Cancel</button></div>
      <p class="tiny muted mt">You will get one QR ticket for the whole sign up. The organizer checks it in on the day.</p>
    </form></div>`;
}
function thanksModal(o) {
  const u = me();
  return `<div class="modal stack">
    <button class="x" data-act="close" aria-label="Close">×</button>
    <div class="ok-note">${esc(o.headline)}</div>
    ${o.body ? `<p class="muted">${o.body}</p>` : ''}
    ${o.ticket || ''}
    ${u ? `<div class="row mt"><button class="btn pri" data-go="${o.goName || 'sup-home'}">${esc(o.goLabel || 'Open my Terra')}</button><button class="btn" data-act="close">Stay on this page</button></div>`
        : `<div class="card stack-s" style="background:var(--raise)">
            <h4>Create a free account and keep this</h4>
            <ul class="ul"><li>${CHECK}<span>Your sponsorship and volunteering history in one place</span></li>
              <li>${CHECK}<span>Certificates once the work is verified</span></li>
              <li>${CHECK}<span>Impact reports for everything you have backed</span></li></ul>
            <div class="row"><button class="btn pri" data-go="signup">Create account</button><button class="btn" data-act="close">Maybe later</button></div>
            <p class="tiny muted">We will attach what you just did using the email or phone number you gave.</p>
          </div>`}
  </div>`;
}
function certModal(kind, p, entry) {
  const svg = certSvg(kind, certData(kind, p, entry));
  return `<div class="modal wide stack">
    <button class="x" data-act="close" aria-label="Close">×</button>
    <h2>${kind === 'sponsor' ? 'Sponsorship certificate' : 'Volunteer certificate'}</h2>
    <div class="cert">${svg}</div>
    <div class="row"><button class="btn pri" data-act="cert-dl" data-kind="${kind}" data-id="${p.id}" data-sid="${entry.id}">Download PNG</button>
      <button class="btn" data-act="print">Print</button><button class="btn" data-act="close">Close</button></div>
  </div>`;
}
function certData(kind, p, entry) {
  const c = CATS[p.cat];
  return {
    name: kind === 'sponsor' ? (entry.anon ? 'Anonymous sponsor' : entry.name) : entry.name,
    amount: kind === 'sponsor' ? rs(entry.amount) : '',
    people: kind === 'volunteer' ? (entry.people > 1 ? entry.people + ' volunteers' : 'their time') : '',
    project: p.title, place: p.place + ', ' + p.district, date: fdate(p.date),
    result: p.ev ? c.phrase(p.ev.achieved) + ' with ' + p.ev.participants + ' people' : c.phrase(p.target),
    id: (kind === 'sponsor' ? 'TS-' : 'TV-') + p.id.toUpperCase() + '-' + String(entry.id).slice(-4).toUpperCase(),
    issued: fdate(p.verified ? p.verified.at : new Date().toISOString().slice(0, 10))
  };
}

<script>
/* ============================================================
   Community site reports
   ============================================================ */
function visibleReports() {
  const u = me();
  if (isStaff() && mode() === 'staff') return DB.reports;
  return DB.reports.filter(r => ['approved','claimed'].includes(r.status) || (u && r.by.userId === u.id));
}
function reports() {
  const list = visibleReports();
  const open = list.filter(r => r.status === 'approved');
  return `${header()}<main><div class="wrap pagehead">
    <div class="row between">
      <div><h1>Reported sites</h1>
        <p class="lead">Places people have photographed and sent to Terra. Once our team approves one, any organizer can pick it up and turn it into a funded project.</p></div>
      <button class="btn pri" data-go="report-new">${ICONS.camera} Report a site</button>
    </div></div>
  <div class="wrap mt">
    <div class="grid4 mb">

    </div>
    ${mapHtml(list.map(r => ({id:r.id, lat:r.lat, lng:r.lng, cat:r.cat, kind:'report', label:r.title + ' — ' + r.place})))}

function reportView(r) {
  if (!r) return notFound();
  const u = me(), staffMode = isStaff() && mode() === 'staff', orgMode = mode() === 'organizer';
  const linked = DB.projects.find(p => p.fromReport === r.id);
  return `${header()}<main><div class="wrap pagehead">
    <button class="linkbtn small" data-go="reports">← All reported sites</button>
    <div class="row mt" style="gap:8px">${statusPill(r.status, RSTATUS)}<span class="tag">${esc(CATS[r.cat].label)}</span></div>
    <h1 style="margin-top:12px">${esc(r.title)}</h1>
    <p class="lead">${esc(r.place)}, ${esc(r.district)} · reported ${fdate(r.created)}</p>
  </div>
  <div class="wrap mt"><div class="split">
    <div class="stack">
      <div class="thumb" style="aspect-ratio:16/10"><img src="${r.photo}" alt="Photo of the reported site"></div>
      <div class="card stack"><h3>What was reported</h3><p class="muted">${esc(r.desc)}</p>
        <dl class="kv mt"><dt>Reported by</dt><dd>${esc(r.by.name)}</dd>
          <dt>Location</dt><dd>${r.lat.toFixed(4)}, ${r.lng.toFixed(4)}</dd>
          ${r.note ? `<dt>Terra note</dt><dd>${esc(r.note)}</dd>` : ''}</dl></div>
      <div class="card stack"><h3>Where it is</h3>${mapHtml([{id:r.id, lat:r.lat, lng:r.lng, cat:r.cat, label:r.place, big:true}], {legend:false})}</div>
      ${linked ? `<div class="card stack"><h3>This became a project</h3><p class="muted small">${esc(linked.org)} picked this site up.</p>
        <div>${projectCard(linked)}</div></div>` : ''}
    </div>
    <aside class="stack sidebar">
      ${staffMode && r.status === 'pending' ? `<div class="card stack">
        <h4>Terra review</h4>
        <p class="small muted">Approve to make this visible to organizers, or turn it down with a reason.</p>
        <form data-form="report-review" data-id="${r.id}">
          <div class="field"><label for="rn">Note for organizers</label><textarea id="rn" name="note" placeholder="What an organizer should know about this site"></textarea></div>
          <div class="row mt"><button class="btn pri" name="decision" value="approved" type="submit">Approve</button>
            <button class="btn danger" name="decision" value="rejected" type="submit">Turn down</button></div>
        </form></div>` : ''}
      ${orgMode && r.status === 'approved' ? `<div class="card stack">
        <h4>Work on this site</h4>
        <p class="small muted">Start a project from this report. The details are copied into the form for you.</p>
        <button class="btn pri block" data-act="claim" data-id="${r.id}">Create a project from this site</button></div>` : ''}
      ${r.status === 'approved' && !orgMode ? `<div class="card stack-s"><h4>Know a group who could do this?</h4>
        <p class="small muted">Organizers can pick this site up and raise the money for it on Terra.</p>
        <button class="btn block" data-go="org-start">Organize a project</button></div>` : ''}
      <div class="card stack-s"><h4>Status</h4>
        <ul class="timeline">
          <li data-done="1"><span class="dot">${CHECK}</span><div><div class="b">Reported</div><div class="small muted">${fdate(r.created)}</div></div></li>
          <li data-done="${r.status !== 'pending' ? 1 : 0}"><span class="dot">${r.status !== 'pending' ? CHECK : ''}</span><div><div class="b">Reviewed by Terra</div>
            <div class="small muted">${r.status === 'pending' ? 'Usually within two working days' : esc(r.reviewedBy || 'Terra team')}</div></div></li>
          <li data-done="${r.status === 'claimed' ? 1 : 0}"><span class="dot">${r.status === 'claimed' ? CHECK : ''}</span><div><div class="b">Picked up by an organizer</div></div></li>
        </ul></div>
    </aside>
  </div></div></main>${footer()}`;
}

function reportNew() {
  const f = state.form, u = me();
  const pin = state.pick || (f.lat ? {lat:f.lat, lng:f.lng} : null);
  return `${header()}<main><div class="wrap narrow pagehead">
    <h1>Report a site that needs work</h1>
    <p class="lead">You passed a place that needs cleaning up or replanting. Send us a photo and where it is. The Terra team checks it, then organizers can take it on.</p>
  </div>
  <div class="wrap narrow mt">
    <form class="card" data-form="report-new">

      <div class="grid2">
        <div class="field"><label for="rc">Type of work needed</label>
          <select id="rc" name="cat">${Object.entries(CATS).map(([k, c]) => `<option value="${k}" ${f.cat === k ? 'selected' : ''}>${esc(c.label)}</option>`).join('')}</select></div>
        <div class="field"><label for="rd">District</label>

      </div>

        ${mapHtml([], {pick:true, pin})}
        <p class="hint">${pin ? 'Pinned at ' + pin.lat.toFixed(4) + ', ' + pin.lng.toFixed(4) + '. Tap again to move it.' : 'Tap the spot. If you are not sure, the district is enough.'}</p></div>
      <div class="field"><label for="rdesc">Tell us what you saw</label>
        <textarea id="rdesc" name="desc" placeholder="How big is it, how long has it been there, is anyone affected" required>${esc(f.desc || '')}</textarea></div>
      ${u ? `<p class="small muted mt">Sent as ${esc(u.name)} (${esc(u.email)}).</p>` : `
        <div class="grid2">

          <div class="field"><label for="rph">Phone</label><input id="rph" name="phone" value="${esc(f.phone || '')}" required></div>
        </div>
        <div class="field"><label for="rem">Email (optional)</label><input id="rem" name="email" type="email" value="${esc(f.email || '')}">

    </form>
  </div></main>${footer()}`;
}

/* ============================================================
   Supporter dashboard
   ============================================================ */
function mySponsorships(u) {
  const out = [];
  DB.projects.forEach(p => (p.sponsors || []).forEach(s => { if (s.userId === u.id) out.push({p, s}); }));
  return out.sort((a, b) => new Date(b.s.date) - new Date(a.s.date));
}
function myVolunteering(u) {
  const out = [];
  DB.projects.forEach(p => (p.vols || []).forEach(v => { if (v.userId === u.id) out.push({p, v}); }));
  return out.sort((a, b) => new Date(b.p.date) - new Date(a.p.date));
}
function myShareOfImpact(u) {
  let kg = 0, ha = 0, money = 0;
  mySponsorships(u).forEach(({p, s}) => {
    money += s.amount;
    if (p.status === 'verified' && p.ev) {
      const share = s.amount / Math.max(raised(p), 1);
      if (p.cat === 'trees') ha += p.ev.achieved * share; else kg += p.ev.achieved * share;
    }
  });
  return {kg, ha, money};
}
function subtabs(items, cur, key) {
  return `<div class="chips mt">${items.map(([k, l]) => `<button class="chip" data-tab="${k}" aria-pressed="${cur === k}">${esc(l)}</button>`).join('')}</div>`;
}
function supHome() {
  const u = me();
  if (!u) return loginView();
  const tab = state.tab || 'overview';
  const sp = mySponsorships(u), vl = myVolunteering(u), mine = myShareOfImpact(u);
  const myReports = DB.reports.filter(r => r.by.userId === u.id);
  const certs = sp.filter(x => x.p.status === 'verified').map(x => ({kind:'sponsor', p:x.p, e:x.s}))
    .concat(vl.filter(x => x.p.status === 'verified').map(x => ({kind:'volunteer', p:x.p, e:x.v})));

  const views = {
    overview: () => {
      const byCat = Object.entries(CATS).map(([k, c]) => ({k:c.short, c:c.color, v:sp.filter(x => x.p.cat === k).reduce((a, x) => a + x.s.amount, 0)})).map(d => Object.assign(d, {t:rs(d.v)}));
      let run = 0;
      const cum = sp.slice().reverse().map(x => { run += x.s.amount; return {k:fdate(x.s.date).slice(0, 6), v:run, t:rs(run)}; });
      const upcoming = vl.filter(x => new Date(x.p.date) >= new Date('2026-09-19'));
      return `<div class="grid4">
          ${tile(rs(mine.money), 'Sponsored in total', 'var(--gold)')}
          ${tile(num(sp.length), 'Projects backed')}
          ${tile(num(vl.reduce((a, x) => a + (x.v.people || 1), 0)), 'Volunteer places taken')}
          ${tile(num(mine.kg, 0) + ' kg', 'Your verified share', 'var(--moss)')}
        </div>
        <div class="grid2 mt">
          <div class="card"><h3>Where your money went</h3>${sp.length ? donut(byCat, {label:'Sponsored', center:rsk(mine.money)}) : '<p class="muted small mt">Nothing yet.</p>'}</div>
          <div class="card"><h3>Your sponsorship over time</h3>${cum.length ? areaLine(cum, {maxLabel:rsk(run)}) : '<p class="muted small mt">Nothing yet.</p>'}</div>
        </div>
        ${upcoming.length ? `<div class="card mt"><h3>Coming up</h3>
          ${upcoming.map(x => `<div class="row between mt" style="gap:12px"><div><div class="b">${esc(x.p.title)}</div>
            <div class="small muted">${fdate(x.p.date)} · ${esc(x.p.place)} · ${x.v.people > 1 ? x.v.people + ' people' : '1 person'}</div></div>
            <button class="btn sm" data-tab="volunteering">See ticket</button></div>`).join('')}</div>` : ''}
        <div class="card mt"><h3>Your projects on the map</h3>
          ${mapHtml(projPoints(sp.map(x => x.p).concat(vl.map(x => x.p)).filter((p, i, a) => a.indexOf(p) === i)))}</div>`;
    },
    sponsorships: () => sp.length ? `<div class="card pad0"><div class="scroll-x"><table class="tbl">
        <thead><tr><th>Project</th><th>Date</th><th>Status</th><th class="r">Amount</th><th></th></tr></thead><tbody>
        ${sp.map(({p, s}) => `<tr>
          <td><button class="linkbtn" data-go="project" data-id="${p.id}">${esc(p.title)}</button><div class="small muted">${esc(p.org)} · ${esc(p.district)}</div></td>
          <td class="muted">${fdate(s.date)}</td><td>${statusPill(p.status)}</td><td class="r b">${rs(s.amount)}</td>
          <td class="r"><div class="row" style="justify-content:flex-end;gap:6px">
            ${p.status === 'verified' ? `<button class="btn sm" data-act="cert" data-kind="sponsor" data-id="${p.id}" data-sid="${s.id}">Certificate</button>` : ''}
            <button class="btn sm" data-act="receipt" data-id="${p.id}" data-sid="${s.id}">Receipt</button></div></td></tr>`).join('')}
        </tbody></table></div></div>
        <p class="small muted mt">Your verified share so far: ${num(mine.kg)} kg of waste and ${num(mine.ha, 2)} ha restored.</p>`
      : empty('No sponsorships yet', 'Back a project and it will show up here with its receipt and certificate.', '<button class="btn pri mt" data-go="projects">Browse projects</button>'),
    volunteering: () => vl.length ? `<div class="stack">${vl.map(({p, v}) => `<div class="card stack-s">
        <div class="row between"><div><h3>${esc(p.title)}</h3><div class="small muted">${fdate(p.date)} · ${esc(p.place)}</div></div>${statusPill(p.status)}</div>
        ${ticketHtml(p, v)}
        <div class="row"><button class="btn sm" data-go="project" data-id="${p.id}">Open project</button>
          ${p.status === 'verified' ? `<button class="btn sm" data-act="cert" data-kind="volunteer" data-id="${p.id}" data-sid="${v.id}">Volunteer certificate</button>` : ''}</div>
      </div>`).join('')}</div>`
      : empty('You have not signed up yet', 'Join a cleanup or a planting day. Groups can sign up with one head count.', '<button class="btn pri mt" data-go="projects">Find a project</button>'),
    certificates: () => certs.length ? `<div class="plist">${certs.map(c => `<div class="card stack-s">
        <div class="row between"><span class="tag">${c.kind === 'sponsor' ? 'Sponsorship' : 'Volunteering'}</span><span class="status s-verified">${CHECK} Verified</span></div>
        <h3>${esc(c.p.title)}</h3><div class="small muted">${fdate(c.p.date)} · ${esc(CATS[c.p.cat].phrase(c.p.ev.achieved))}</div>
        <button class="btn sm" data-act="cert" data-kind="${c.kind}" data-id="${c.p.id}" data-sid="${c.e.id}">Open certificate</button></div>`).join('')}</div>`
      : empty('No certificates yet', 'Certificates appear once the Terra team has verified the work you backed or joined.'),
    reports: () => myReports.length ? `<div class="plist">${myReports.map(reportCard).join('')}</div>`
      : empty('You have not reported a site yet', 'Photograph a place that needs work and send it in. Organizers pick sites up from there.', '<button class="btn pri mt" data-go="report-new">Report a site</button>')
  };
  const body = views[tab] || views.overview;

  return `${header()}<main><div class="wrap pagehead">
    <h1>Hello, ${esc(u.name.split(' ')[0])}</h1>
    <p class="lead">Everything you have funded, joined and reported. Switch to the organizer view any time you want to run a project yourself.</p>
    ${subtabs([['overview','Overview'], ['sponsorships','Sponsorships'], ['volunteering','Volunteering'], ['certificates','Certificates'], ['reports','My reports']], tab)}
  </div>
  <div class="wrap mt">${body()}</div></main>${footer()}`;
}

function settings() {
  const u = me();
  if (!u) return loginView();
  return `${header()}<main><div class="wrap narrow pagehead"><h1>Account settings</h1>
    <p class="lead">Simulated account. Changes are kept in this browser.</p></div>
  <div class="wrap narrow mt stack">
    <form class="card" data-form="settings">
      <div class="field"><label for="an">Name</label><input id="an" name="name" value="${esc(u.name)}"></div>
      <div class="grid2">
        <div class="field"><label for="ae">Email</label><input id="ae" name="email" type="email" value="${esc(u.email)}"></div>
        <div class="field"><label for="ap">Phone</label><input id="ap" name="phone" value="${esc(u.phone)}"></div>
      </div>
      <label class="radio mt" data-on="${u.organizer ? 1 : 0}" style="align-items:center"><input type="checkbox" name="organizer" ${u.organizer ? 'checked' : ''}>
        <span><b>Organizer view</b><br><span class="small muted">Lets you create and run projects</span></span></label>
      <div class="mt"><button class="btn pri" type="submit">Save changes</button></div>
    </form>
    <div class="card stack-s"><h3>Prototype data</h3>
      <p class="small muted">Reset returns every account, project and report to the sample data.</p>
      <div><button class="btn danger" data-act="reset">Reset demo data</button></div></div>
  </div></main>${footer()}`;

</script>
<script>
/* ============================================================
   Organizer mode
   ============================================================ */
function myProjects(u) { return DB.projects.filter(p => p.ownerId === u.id); }

function orgStart() {
  const u = me(), f = state.form;
  if (u && u.organizer && u.orgProfile) return orgHome();
  return `${header()}<main><div class="wrap narrow pagehead">
    <h1>Organize a project on Terra</h1>
    <p class="lead">For community groups, cooperatives, clubs, ward committees and individuals who already do this work. Terra raises the money, brings volunteers, and verifies the result so sponsors trust it.</p>
  </div>
  <div class="wrap narrow mt stack">
    <div class="card stack">
      <h3>What you get</h3>
      <ul class="ul">
        <li>${CHECK}<span>A public project page with your budget, date and target result</span></li>
        <li>${CHECK}<span>${Math.round(UPFRONT * 100)}% of the funds released as soon as the project is fully funded, so you can buy tools and book transport</span></li>
        <li>${CHECK}<span>Volunteer sign ups with QR tickets and a check-in screen for the day</span></li>

    <text x="40" y="722" font-size="14" fill="#9FB4B5">before and after photos, weights and a location stamp.</text>
